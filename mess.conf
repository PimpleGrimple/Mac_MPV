#default-bindings        start

MBTN_LEFT                ignore                                                           # don't do anything
MBTN_LEFT_DBL            cycle fullscreen                                                 # toggle fullscreen
MBTN_RIGHT               cycle pause                                                      # Right click toggle pause [Default: script-binding select/context-menu]
MBTN_RIGHT_DBL           cycle fullscreen
MBTN_BACK                playlist-prev                                                    # skip to the previous file
MBTN_FORWARD             playlist-next                                                    # skip to the next file
Ctrl+MBTN_LEFT           script-binding positioning/drag-to-pan                           # pan around the clicked point

# Mouse wheels, touchpad or other input devices that have axes
# if the input devices supports precise scrolling it will also scale the
# numeric value accordingly
WHEEL_UP                 ignore                                                           # Disable wheel volume [Default: add volume  2]
WHEEL_DOWN               ignore                                                           # Disable wheel volume [Default: add volume -2]
WHEEL_LEFT               seek 1 exact                                                     # Trackpad left scroll seek forward [Default: seek -10]
WHEEL_RIGHT              seek -1 exact                                                    # Trackpad right scroll seek backward [Default: seek  10]

## Seek units are in seconds, but note that these are limited by keyframes
RIGHT                    seek  5                                                          # seek 5 seconds forward
LEFT                     seek -5                                                          # seek 5 seconds backward
UP                       add volume 5                                                     # Volume up [Default: seek  60]
DOWN                     add volume -5                                                    # Volume down [Default: seek -60]
# Do smaller, always exact (non-keyframe-limited), seeks with shift.
# Don't show them on the OSD (no-osd).
Shift+RIGHT              no-osd seek  1 exact                                             # seek exactly 1 second forward
Shift+LEFT               no-osd seek -1 exact                                             # seek exactly 1 second backward
Shift+UP                 no-osd seek  5 exact                                             # seek exactly 5 seconds forward
Shift+DOWN               no-osd seek -5 exact                                             # seek exactly 5 seconds backward
Ctrl+LEFT                no-osd sub-seek -1                                               # seek to the previous subtitle
Ctrl+RIGHT               no-osd sub-seek  1                                               # seek to the next subtitle
Ctrl+Shift+LEFT          sub-step -1                                                      # change subtitle timing such that the previous subtitle is displayed
Ctrl+Shift+RIGHT         sub-step 1                                                       # change subtitle timing such that the next subtitle is displayed
Alt+left                 add video-pan-x  0.1                                             # move the video right
Alt+right                add video-pan-x -0.1                                             # move the video left
Alt+up                   add video-pan-y  0.1                                             # move the video down
Alt+down                 add video-pan-y -0.1                                             # move the video up
Alt++                    add video-zoom   0.1                                             # zoom in
ZOOMIN                   add video-zoom   0.1                                             # zoom in
Alt+-                    add video-zoom  -0.1                                             # zoom out
ZOOMOUT                  add video-zoom  -0.1                                             # zoom out
Alt+KP_ADD               add video-zoom  0.1                                              # zoom in
Alt+KP_SUBTRACT          add video-zoom -0.1                                              # zoom out
Ctrl+WHEEL_UP            script-binding positioning/cursor-centric-zoom  0.1              # zoom in towards the cursor
Ctrl+WHEEL_DOWN          script-binding positioning/cursor-centric-zoom -0.1              # zoom out towards the cursor
Alt+BS                   set video-zoom 0; no-osd set panscan 0; no-osd set video-pan-x 0; no-osd set video-pan-y 0; no-osd set video-align-x 0; no-osd set video-align-y 0 # reset zoom and pan settings
HOME                     seek 0 absolute                                                  # seek to the start
PGUP                     add chapter 1                                                    # seek to the next chapter
PGDWN                    add chapter -1                                                   # seek to the previous chapter
Shift+PGUP               seek  600                                                        # seek 10 minutes forward
Shift+PGDWN              seek -600                                                        # seek 10 minutes backward
[                        script-binding modernx/prevchapter                               # Previous chapter [Default: multiply speed 1/1.1]
]                        script-binding modernx/nextchapter                               # Next chapter [Default: multiply speed 1.1]
{                        frame-back-step                                                  # Go back one frame [Default: multiply speed 0.5]
}                        frame-step                                                       # Advance one frame [Default: multiply speed 2.0]
BS                       set speed 1                                                      # reset the speed to normal
Shift+BS                 revert-seek                                                      # undo the previous (or marked) seek
Shift+Ctrl+BS            revert-seek mark                                                 # mark the position for revert-seek
q                        quit
Q                        quit-watch-later                                                 # exit and remember the playback position
q {encode}               quit 4
ESC                      set fullscreen no                                                # leave fullscreen
ESC {encode}             quit 4
p                        script-binding select/select-playlist                            # Playlist menu [Default: cycle pause]
.                        add speed 0.1                                                    # Increase speed [Default: frame-step]
,                        add speed -0.1                                                   # Decrease speed [Default: frame-back-step]
SPACE                    cycle pause                                                      # toggle pause/playback mode
>                        playlist-next                                                    # skip to the next file
ENTER                    playlist-next ; set pause no                                     # Next file (play) [Default: playlist-next]
<                        playlist-prev                                                    # skip to the previous file
Shift+HOME               no-osd set playlist-pos 0                                        # skip to the first file
Shift+END                no-osd set playlist-pos-1 ${playlist-count}                      # skip to the last file
O                        no-osd cycle-values osd-level 3 1                                # toggle displaying the OSD on user interaction or always
o                        show-progress                                                    # show playback progress
P                        show-progress                                                    # show playback progress
i                        script-binding stats/display-stats                               # display information and statistics
I                        script-binding stats/display-stats-toggle                        # toggle displaying information and statistics
?                        script-binding stats/display-page-4-toggle                       # toggle displaying key bindings
`                        script-binding commands/open                                     # open the console
z                        script-binding modernx/shuffle_playlist                          # Shuffle playlist [Default: add sub-delay -0.1]
Z                        playlist-unshuffle ; show-text "Unshuffled"                      # Unshuffle playlist [Default: add sub-delay  0.1]
x                        script-binding modernx/cyclecaptions                             # Cycle captions [Default: add sub-delay  0.1]
ctrl++                   add audio-delay  0.1                                             # change audio/video sync by delaying the audio
ctrl+-                   add audio-delay -0.1                                             # change audio/video sync by shifting the audio earlier
ctrl+KP_ADD              add audio-delay  0.1                                             # change audio/video sync by delaying the audio
ctrl+KP_SUBTRACT         add audio-delay -0.1                                             # change audio/video sync by shifting the audio earlier
G                        add sub-scale  0.1                                               # increase the subtitle font size
F                        add sub-scale -0.1                                               # decrease the subtitle font size
9                        set sub-delay 0                                                  # Reset subtitle delay [Default: add volume -2]
/                        set speed 1                                                      # Reset speed [Default: add volume -2]
KP_DIVIDE                add volume -2
0                        set sub-scale 1.0                                                # Reset subtitle scale [Default: add volume  2]
*                        add volume  2
KP_MULTIPLY              add volume 2
m                        cycle mute                                                       # toggle mute
1                        apply-profile Inverse-TM ; show-text "Inverse-TM"                # Enable Inverse Tone Mapping [Default: add contrast -1]
2                        cycle deband ; show-text "Deband: ${deband} (It: ${deband-iterations} | Th: ${deband-threshold} | Gr: ${deband-grain})" # Toggle deband filter [Default: add contrast 1]
3                        apply-profile Anime4K ; show-text "Anime4K"                      # Enable Anime4K upscaling [Default: add brightness -1]
4                        add brightness 1
5                        cycle-values blend-subtitles "yes" "no"                          # Toggle subtitle blending [Default: add gamma -1]
6                        add gamma 1
7                        add sub-delay -0.1                                               # Shift subtitles earlier [Default: add saturation -1]
8                        add sub-delay 0.1                                                # Delay subtitles [Default: add saturation 1]
Alt+0                    set window-scale 0.5                                             # halve the window size
Alt+1                    set window-scale 1                                               # reset the window size
Alt+2                    set window-scale 2                                               # double the window size
b                        script-binding modernx/persistenttoggle                          # Toggle OSC interface [Default: cycle deband]
d                        cycle deinterlace                                                # cycle the deinterlacing filter
r                        cycle-values video-rotate 90 180 270 0                           # Rotate video [Default: add sub-pos -1]
R                        add sub-pos +1                                                   # move subtitles down
t                        add sub-pos +1                                                   # move subtitles down
v                        cycle sub-visibility                                             # hide or show the subtitles
Alt+v                    cycle secondary-sub-visibility                                   # hide or show the secondary subtitles
V                        cycle sub-ass-use-video-data                                     # cycle which video data gets used in ASS rendering to fix broken files
u                        cycle-values sub-ass-override "force" "scale"                    # toggle overriding SSA/ASS subtitle styles with the normal styles
j                        screenshot video ; show-text "screenshot video"                  # Screenshot without OSD/subs [Default: cycle sub]
J                        screenshot window ; show-text "screenshot window"                # Screenshot with OSD/subs [Default: cycle sub down]
SHARP                    cycle audio                                                      # switch audio track
_                        cycle video                                                      # switch video track
T                        cycle ontop                                                      # toggle placing the video on top of other windows
f                        cycle fullscreen                                                 # toggle fullscreen
s                        cycle sub                                                        # Switch subtitle track [Default: screenshot]
S                        cycle sub down                                                   # Switch subtitle track backward [Default: screenshot video]
Ctrl+s                   change-list glsl-shaders toggle "~~/shaders/ArtCNN/shadow_fix.glsl" ; show-text "Toggle Shadow Fix" # Toggle ArtCNN Shadow Fix shader [Default: screenshot window]
Alt+s                    screenshot each-frame                                            # automatically screenshot every frame; issue this command again to stop taking screenshots
w                        cycle-values panscan 1.0 0.0                                     # Toggle panscan crop zoom [Default: add panscan -0.1]
W                        add panscan +0.1                                                 # shrink black bars by cropping the video
e                        add panscan +0.1                                                 # shrink black bars by cropping the video
A                        cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "no"    # cycle the video aspect ratio
POWER                    quit
PLAY                     cycle pause                                                      # toggle pause/playback mode
PAUSE                    cycle pause                                                      # toggle pause/playback mode
PLAYPAUSE                cycle pause                                                      # toggle pause/playback mode

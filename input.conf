¿                cycle-values hwdec "no" "videotoolbox"
÷                cycle-values ao avfoundation coreaudio ; show-text "Switched Audio Pipeline Setup"
meta+z           revert-seek
‘                seek +87
“                seek -87
≤                sub-seek -1
≥                sub-seek 1
=                add sub-scale +0.1
-                add sub-scale -0.1
meta+left        write-watch-later-config ; playlist-prev ; set pause no
Ctrl+u           cycle-values sub-ass-override "force" "scale"
Ctrl+j           vf toggle format=colorlevels=limited
meta+BS async run /bin/sh -c 'mv -f "$1" "$HOME/.Trash/"' -- "${path}" ; playlist-remove current
o                run "/bin/zsh" "-c" 'p="$1"; if [[ "$p" == *"://"* ]]; then /usr/bin/open "$p"; else /usr/bin/open -R "$p"; fi' -- "${path}"
O run "/bin/zsh" "-c" 'p="$(printf %s "$1" | /usr/bin/sed "s|^~|$HOME|")"; /bin/mkdir -p "$p"; /usr/bin/open "$p"' -- "${screenshot-dir}"
Ø run "/bin/zsh" "-c" 'p="$(printf %s "$1" | /usr/bin/sed "s|^~|$HOME|; s|/*$||")"; t="$(/usr/bin/basename "$p")"; c="$(/usr/bin/dirname "$(/usr/bin/dirname "$p")")/clips/$t"; /bin/mkdir -p "$c"; /usr/bin/open "$c"' -- "${screenshot-dir}"
Ctrl+r           async run sh -c 'sleep 0.4 && open -a mpv "${path}"'; quit
Shift+MBTN_LEFT  change-list glsl-shaders clr "" ; vf clr ""
meta+/           enable-section image-mode ; set shuffle no ; playlist-unshuffle ; show-text "Reader: On"
ctrl+C           set video-crop 1280x720+0+120
SPACE  {image-mode} playlist-next ; set pause no
right  {image-mode} playlist-next ; set pause no
left   {image-mode} playlist-prev ; set pause no
meta+/ {image-mode} set shuffle yes ; playlist-shuffle ; show-text "Reader: Off" ; disable-section image-mode
Ctrl+1 vf clr ""; vf add lavfi=[fieldmatch=order=auto:mode=pcn_ub:combmatch=full:cthresh=4,decimate]; show-text "Deint: telecine"
Ctrl+2 vf clr ""; vf add lavfi=[bwdif=mode=1:parity=auto:deint=interlaced]; show-text "Deint: interlaced"
Ctrl+3 vf clr ""; vf add lavfi=[fieldmatch=order=auto:mode=pcn_ub:combmatch=full:cthresh=4,bwdif=mode=0:parity=auto:deint=interlaced,decimate]; show-text "Deint: mix"
Ctrl+0 vf clr ""; show-text "Deint: off"


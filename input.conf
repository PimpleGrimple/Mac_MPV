# default-bindings start

MBTN_LEFT        ignore              # don't do anything
MBTN_LEFT_DBL    cycle fullscreen    # toggle fullscreen
#MBTN_RIGHT       script-binding select/context-menu # open context menu
MBTN_RIGHT       cycle pause         # Right click toggle pause
MBTN_BACK        playlist-prev       # skip to the previous file
MBTN_FORWARD     playlist-next       # skip to the next file
Ctrl+MBTN_LEFT   script-binding positioning/drag-to-pan # pan around the clicked point

#WHEEL_UP         add volume  2
WHEEL_UP         ignore
#WHEEL_DOWN       add volume -2
WHEEL_DOWN       ignore
#WHEEL_LEFT       seek -10            # seek 10 seconds backward
WHEEL_LEFT       seek 0.0833 exact
#WHEEL_RIGHT      seek  10            # seek 10 seconds forward
WHEEL_RIGHT      seek -0.0833 exact

RIGHT            seek 2 exact        # seek 3 seconds 
LEFT             seek -2 exact       # seek 3 seconds backward
#UP               seek  60            # seek 1 minute forward
UP               add volume 5
#DOWN             seek -60            # seek 1 minute backward
DOWN             add volume -5


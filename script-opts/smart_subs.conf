# smart_subs options

# Comma-separated title keywords preferred when selecting a full auto subtitle track.
priority_keywords=dialogue,full,complete
# Comma-separated title keywords to reject when selecting a full auto subtitle track.
reject_keywords=signs,songs,commentary

# Keywords to match forced/signs subtitles when audio matches subtitle language (e.g. English dub)
forced_keywords=signs,songs,forced,s&s
forced_reject_keywords=commentary

# Enable audio-aware track selection (e.g., signs/songs for English dub, full for Japanese)
audio_aware=yes

# Behavior when audio matches subtitle language, but no signs/forced sub track exists:
# 'no' = disable subtitles; 'full' = fall back to full dialogue; 'keep' = do not change sid
fallback_on_matching_audio=no

# Automatically re-evaluate and switch subtitles if the audio track changes
observe_audio_switches=yes

# Built-in positioning.lua options (mpv 0.41).
# The script provides script-bindings for pan-x, pan-y and cursor-centric-zoom.

# When aligning to the cursor, keep following the mouse instead of
# activating only while the bound key is held.
toggle_align_to_cursor=no

# Suppress mpv's OSD while panning/zooming.
suppress_osd=no

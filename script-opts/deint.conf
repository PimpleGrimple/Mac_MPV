# ═══════════════════════════════════════════════════════════════════════════════
# deint.conf — runtime options
# To tune the actual filter parameters (fieldmatch mode, cthresh, nnedi nns/qual)
# edit the filter strings at the top of scripts/deint.lua directly.
# ═══════════════════════════════════════════════════════════════════════════════

# Automatically scan SD video (height 576 or below) for field cadence on load.
auto_scan_sd=yes

# Show a brief OSD message when an automatic scan finishes.
auto_scan_osd=no

# Default deint chain on startup.
# Shift+X cycles these live; the per-file choice is remembered in cache.
#
#   auto      = run vsdetect and pick automatically
#               vsdetect → chain mapping:
#                 telecine       → telecine  (clean NTSC film, ~23.976fps)
#                 interlaced     → bob       (genuine interlaced video, ~59.94fps)
#                 mix_telecine   → mix       (telecine + mixed decimate + bwdif)
#                 mix_interlaced → hybrid    (fieldmatch + full bob, no decimate)
#
#   telecine  = fieldmatch + decimate
#   bob       = bwdif field-rate
#   mix       = fieldmatch + decimate=mixed=1 + bwdif
#   hybrid    = fieldmatch + bwdif field-rate (no decimate)
#   off       = no filter
chain=auto
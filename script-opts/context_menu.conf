# Built-in context_menu.lua options (mpv 0.41).
# This is the Lua fallback for the right-click menu (used when the native
# context menu is unavailable, e.g. D3D11 exclusive fullscreen).
# Colours are RGB hex; alphas are 0 (opaque) to 255 (invisible).

# Text size and row spacing.
font_size=14
gap=0.2

# Inner padding of menu items, in pixels.
padding_x=8
padding_y=4

# Menu border and corner rounding.
menu_outline_size=0
menu_outline_color=#FFFFFF
corner_radius=5

# 0 = solid menu background, 255 = fully transparent.
background_alpha=0

# Scale the menu with the window height: yes, no, or auto.
scale_with_window=auto

# Colours for the focused item and disabled entries.
focused_color=#222222
focused_back_color=#FFFFFF
disabled_color=#555555

# Delay before a hovered submenu opens/closes, in seconds.
seconds_to_open_submenus=0.2
seconds_to_close_submenus=0.2

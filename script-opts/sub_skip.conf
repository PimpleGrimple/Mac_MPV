# Start with automatic subtitle-gap skipping enabled.
default_state=no
# How to handle gaps: speed fast-forwards; seek jumps to the next subtitle.
skip_mode=speed
# Ignore subtitle gaps shorter than this many seconds.
min_skip_interval=1.5
# Playback speed used during gaps when skip_mode=speed (0.1 to 100).
speed_skip_speed=2.5
# Seconds to wait after a subtitle ends before speeding up.
lead_in=0
# Seconds before the next subtitle to return to normal speed.
lead_out=1.4

# Target integrated loudness in LUFS.
rg_target_lufs=-14.0
# Gain adjustment for the increase/decrease shortcuts, in dB.
step_db=0.10
# Tolerance in dB used to avoid needless audio-filter updates.
eps=0.005
# Keep calculated gain below the track's known peak to avoid clipping.
peak_protect=true
# Seconds to wait after a gain change before automatically writing tags.
auto_bake_debounce=15
# Label assigned to the script's temporary volume audio filter.
filter_label=replaygain
# Write ReplayGain tags automatically after changes (true/false).
auto_bake=false
# Scan files/streams automatically when they load (true/false).
auto_scan=true
# Maximum stream data, in MiB, used while estimating loudness.
stream_cache_mb=50
# Maximum stream duration, in seconds, used while estimating loudness.
stream_cache_sec=30
# Cache scan results on disk (true/false).
cache_results=true
# Directory holding the ReplayGain results cache.
cache_dir=~~/cache/scripts/replaygain

# Shared menu appearance used by AutoSubSync, the styles menu, and any other
# script that imports scripts/autosubsync/menu_style.lua. Per-script menu_* settings
# override these shared values.
theme=
anchor=top-right
# Leave blank to position from the selected anchor instead.
pos_x=
pos_y=
margin=30
canvas_height=720
rect_width=460
rect_height=48
pill_height=40
padding=15
text_inset=15
radius=12
pill_radius=8
max_rows=9
bg_color=111111
bg_alpha=90
border_color=666666
border_alpha=60
accent_color=ffffff
blur=10
shadow=0
pill_border_alpha=40
pill_fill_alpha=88
active_bg_color=000000
active_bg_alpha=AA
text_color=ffffff
text_border_color=111111
text_border=1.5
# Empty font values inherit mpv's OSD font.
font=
font_size=19
font_size_selected=21
bold=no
italic=no
desc_color=AAAAAA
desc_font=
desc_size=14
disabled_alpha=80
separator_color=ffffff
separator_alpha=D0
scrollbar=yes
scrollbar_width=3
hover=yes
number_keys=yes

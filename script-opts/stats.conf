# Built-in MPV statistics overlay. These are the upstream defaults.
# Keys used while a stats page is open.
key_page_1=1
key_page_2=2
key_page_3=3
key_page_4=4
key_page_5=5
key_page_0=0
key_scroll_up=UP
key_scroll_down=DOWN
key_search=/
key_exit=ESC
scroll_lines=1
# Display duration and redraw interval in seconds.
duration=4
redraw_delay=1
ass_formatting=yes
persistent_overlay=no
filter_params_max_length=100
file_tag_max_length=128
file_tag_max_count=16
show_frame_info=no
term_clip=yes
track_info_selected_only=yes
debug=no

# Performance graphs.
plot_perfdata=no
plot_vsync_ratio=no
plot_vsync_jitter=no
plot_cache=yes
plot_tonemapping_lut=no
skip_frames=5
global_max=yes
flush_graph_data=yes
plot_bg_border_color=0000FF
plot_bg_color=262626
plot_color=FFFFFF
plot_bg_border_width=1.25

# Text styling; empty color/font values inherit MPV defaults.
font=
font_mono=monospace
font_size=20
font_color=
border_size=1.65
border_color=
# Use a large value to disable each shadow offset.
shadow_x_offset=1e999
shadow_y_offset=1e999
shadow_color=
alpha=11
vidscale=auto
custom_header=

# Text-formatting tokens for ASS and non-ASS output.
#ass_nl=
#ass_indent=
#ass_prefix_sep=
#ass_b1=
#ass_b0=
#ass_it1=
#ass_it0=
#no_ass_nl=
#no_ass_indent=    
#no_ass_prefix_sep= 
#no_ass_b1=
#no_ass_b0=
#no_ass_it1=
#no_ass_it0=
# Print the bindings page to terminal and exit when set to yes.
bindlist=no

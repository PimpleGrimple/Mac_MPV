# smartcut.conf  ->  ~/.config/mpv/script-opts/smartcut.conf
#
# Read by smartcut.py every time a cut starts, so edits apply to the next
# cut without restarting mpv. Format: key=value, one per line, comments on
# their own line starting with '#'. Missing keys fall back to the defaults
# built into smartcut.py.


# ── Cut points ──────────────────────────────────────────────────────────────
# How mpv's A/B marks become cut points.
#   frames    : use mpv's frame numbers (estimated-frame-number). If a frame
#               number lands more than frame_check_tolerance frames away from
#               mpv's own timestamp for that mark, it is ignored and the
#               timestamp is used instead (a warning is logged).
#   timestamp : always use mpv's time-pos timestamps, snapped to the nearest
#               real frame. Never looks at frame numbers.
cut_marks=frames

# Max allowed frame-number vs timestamp disagreement, in frames (cut_marks=frames only).
frame_check_tolerance=1

# Timestamp mode only: how many frames to add after the frame found at mark B's
# timestamp. mpv's time-pos reads behind the frame on screen, so 1 is the usual
# value. Use 0 if timestamp-mode cuts end one frame late, 2 if one frame early.
# Frame-number mode never adds any. Range 0-5.
end_frame_offset=1


# ── After each Smart Cut ────────────────────────────────────────────────────
# Verify the finished clip and log "[check] OK" or "[check] WARN ...": it must
# start on a keyframe, contain the expected number of frames, and its audio must
# start and end within 2 frames of the video. Reads the file once, so it adds a
# little time on very large cuts. A warning also shows in the OSD when done.
self_check=yes
# smartcut_lib copies the source file's statistics tags (duration, frame count,
# bitrate and size of the WHOLE movie) into the clip, where they are wrong and
# show up in tools like MediaInfo. This deletes them in place (header edit only;
# video/audio data is untouched). Needs mkvpropedit: brew install mkvtoolnix
strip_stale_tags=yes


# ── Smart Cut: encoder for the re-encoded parts ──────────────────────────────
# Only the GOP-edge slivers are re-encoded (the rest is stream-copied). For a
# cut that sits inside a single GOP, the whole range is re-encoded with these.
# "auto" keeps smartcut_lib's built-in "normal" setting: CRF 18 (22 for
# HEVC/AV1/VP9), x264/x265 at the encoder's default preset (medium), SVT-AV1 at 7.
#
# CRF, 0-63 (lower = better quality / bigger). Applied exactly as written for
# every codec, so e.g. smartcut_crf=18 means CRF 18 for x264, x265 and AV1 alike
# (note: "auto" is NOT the same for HEVC, it is 22 there). Pick a CRF close to
# how the source was encoded so the re-encoded frames match the copied ones.
smartcut_crf=auto
# x264/x265 preset: ultrafast superfast veryfast faster fast medium slow
# slower veryslow placebo. Slower = smaller file / better quality, longer encode.
smartcut_preset=auto
# AV1 only: SVT-AV1 preset 0-13 (lower = slower/better), libaom cpu-used 0-8.
smartcut_preset_av1=auto


# ── Compress (.compressed.mkv) ──────────────────────────────────────────────
# Plain full re-encode of the whole marked range at a delivery CRF/preset.
compress_crf=10
compress_preset=slower
compress_preset_av1=4
# Encoder forced for Compress regardless of source codec.
#   libx264 | libx265 | libsvtav1 | libvpx-vp9 | none (match the source codec)
compress_encoder=libsvtav1


# ── Pan Smash (.panorama.png) ───────────────────────────────────────────────
# Pixels trimmed off the left/right frame edges before tracking, to drop
# few-pixel mastering defects. Raise it if a dark edge is still visible.
edge_trim=4
# If the total measured pan span is at or below this many pixels, the shot is
# treated as static: only the anchor plus the first/last good frames are
# composited instead of every frame.
pan_minor_px=12.0
# For a real pan, a frame is only pasted if it moved at least this many pixels
# from the last pasted frame (skips near-duplicate in-between frames).
pan_step_px=6.0
# PNG compression level, 0 (fastest, biggest) to 9 (slowest, smallest).
# Lossless either way.
png_compress_level=9


# ── GIF (.pan.gif) ──────────────────────────────────────────────────────────
gif_fps=12
# Long-edge cap in pixels; 0 = keep the source width.
gif_max_width=960
# Palette size, 2-256.
gif_colors=256
# ffmpeg paletteuse dither: bayer, sierra2, sierra2_4a, none, ...
gif_dither=sierra2_4a
# 0 = loop forever, -1 = no loop, N = loop N times.
gif_loop=0
# Extra 16-235 -> 0-255 levels stretch on the palette source frames. Normally
# off: the filter graph already expands the range. Turn on (yes) only if a GIF
# comes out looking pale, then compare.
gif_levels_stretch=no

# auto_skip.conf  ->  ~~/script-opts/auto_skip.conf
#
#   <option>             applies to every source
#   <source>_<option>    overrides it for that source only
# Sources: local, aniskip, introdb, sponsorblock
# Values: yes / no, numbers, text. mpv does not allow comments after a value.

# Order the sources are tried in. The first one that finds something to skip
# wins; the ones after it are not queried. Remove a name to turn it off.
#   local     chapter titles inside the file (offline)
#   aniskip   AniList + AniSkip (anime openings / endings)
#   introdb   TheIntroDB (TV episodes and movies)
priority=local,aniskip,introdb

# YouTube videos are checked against SponsorBlock first (and only that when the
# video ID is certain, e.g. a youtube.com URL); the priority list is not used for them.
sponsorblock=yes

# toggle_key: pause / resume all skipping (lookups and chapters still happen)
# rescan_key: look the current file up again, ignoring the cache and replacing it
# Set a key to nothing to disable it. Both also work as script messages:
# auto-skip-toggle and auto-skip-rescan.
toggle_key=alt+s
rescan_key=Alt+R

# Skip each segment only once per file, so seeking back into it stays possible.
skip_once=yes
# An Ending that runs to the end of the file starts the next playlist item.
advance_on_ending=yes
# Short "Skipped Opening" message after each skip.
show_skip_feedback=yes
# Per-source overrides, for example:
#   local_skip_once=no
#   sponsorblock_show_skip_feedback=no
# Leave these blank to inherit the three global settings above. They are the
# complete set of source-specific overrides supported by the script.
local_skip_once=
local_advance_on_ending=
local_show_skip_feedback=
aniskip_skip_once=
aniskip_advance_on_ending=
aniskip_show_skip_feedback=
introdb_skip_once=
introdb_advance_on_ending=
introdb_show_skip_feedback=
sponsorblock_skip_once=
sponsorblock_advance_on_ending=
sponsorblock_show_skip_feedback=

# What each source skips (each has its own labels)
#   local: Opening, Ending, Preview, Intro (cold open / prologue), Misc
#          (title lists are at the top of localchapters.lua; put your own under Misc)
local_categories=Opening,Ending,Misc
#   aniskip: Opening, Ending, Recap
aniskip_categories=Opening,Ending
#   introdb: Intro, Recap, Credits, Preview
introdb_categories=Intro,Credits,Preview
#   sponsorblock: sponsor, intro, outro, interaction, selfpromo, preview,
#                 music_offtopic, filler
sponsorblock_categories=sponsor,music_offtopic

# introdb finds the title by a tag in the path ([tmdbid-N] / {imdb-ttN}) or, if you
# set a TMDB key (v3 key or v4 read token), by searching the filename.
introdb_tmdb_api_key=16643a437e4569432036441a2b8cdb88
# Season used when a file has an episode number but no season.
introdb_default_season=1

# Log more detail (requests, cache hits, why a source found nothing).
debug=no

# Format-picker menu for network videos (mpv-selectformat).
# Prefer the protocol indicated by yt-dlp when formats are otherwise comparable.
prioritize_proto=yes
# Hide yt-dlp formats labelled as AI-upscaled.
exclude_ai_upscaled=yes
# Prefer audio up to 70 kbps at or below this short-edge resolution; 0 disables it.
lower_quality_audio=720
# Text placed before the menu header, normal rows, selected row, and unfolded rows.
prefix_header=  
prefix_norm=  
prefix_cursor=● 
prefix_norm_sel=○ 
prefix_indent=  
# Character used to draw the header rule, and its visual-width correction.
header_separator=─
separator_scale=0.75
# Menu position as a percentage of the video area.
menu_pos_x=7
menu_pos_y=15
# ASS styling applied to the menu text.
ass_style={\fnmonospace\fs10}

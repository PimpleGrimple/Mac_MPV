# The monospace font used when there are completions to align in a grid.
# When there are no completions, --osd-font is used.
monospace_font=

# The font size. This will be multiplied by display-hidpi-scale when the console is not scaled with the window.
font_size=24

# The font border size.
border_size=1.65

# The transparency of the menu's background. Ranges from 0 (opaque) to 255 (fully transparent).
background_alpha=80

# The gap between menu items, specified as a percentage the font size.
gap=0.2

# The padding of the menu.
padding=10

# The size of the menu's border.
menu_outline_size=0

# The color of the menu's border.
menu_outline_color=#FFFFFF

# The radius of the menu's corners.
corner_radius=8

# The margin from the left of the window.
# Default: same as --osd-margin-x
margin_x=-1

# The margin from the bottom of the window.
# Default: same as --osd-margin-y
margin_y=-1

# Whether to scale the console with the window height. Can be yes, no, or auto, which follows the value of --osd-scale-by-window.
scale_with_window=auto

# The color of the focused item.
focused_color=#222222

# The background color of the focused item.
focused_back_color=#FFFFFF

# The color of characters that match the searched string.
match_color=#0088FF

# Whether to match menu search queries exactly instead of fuzzily. Without this option, prefixing queries with ' enables exact matching.
exact_match=no

# Whether exact searches are case sensitive. Only works with ASCII characters.
case_sensitive=no

# Remove duplicate entries in history as to only keep the latest one.
history_dedup=yes

# The ratio of font height to font width. Adjusts grid width of completions. Values in the range 1.8..2.5 make sense for common monospace fonts.
font_hw_ratio=auto
# Physical peak luminance of the display, in nits.
display_peak_nits=500.0
# macOS display ID controlled by this script.
display_id=1
# Brightness for HDR, inverse-tone-mapped HDR, and SDR. Use nits (e.g. 120nits)
# or a macOS 16-step position (e.g. 10/16); bare numbers are intentionally invalid.
hdr_brightness=500nits
inv_tm_brightness=120nits
sdr_brightness=100nits
# Apply sdr_brightness whenever ordinary SDR content becomes active.
jump_to_sdr_on_start=yes
# Remember manual SDR brightness changes for this mpv session.
remember_sdr_adjustments=no
# Smooth brightness changes instead of applying them instantly.
fade=yes
# Duration of normal brightness fades, in seconds.
fade_duration=0.1
# Fade back to the desktop brightness when mpv quits.
shutdown_fade=no
# Duration of the shutdown fade, in seconds.
shutdown_fade_duration=0.1
# Only adjust brightness while the mpv window is focused.
only_when_focused=yes

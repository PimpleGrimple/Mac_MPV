# IPC socket and thumbnail-output paths. Empty values create unique /tmp paths.
socket=
thumbnail=
# Maximum thumbnail dimensions in pixels.
max_height=200
max_width=200
# Integer multiplier applied to the thumbnail dimensions.
scale_factor=1
# Tone mapping for HDR thumbnails: auto, none, clip, linear, gamma, reinhard,
# hable, or mobius.
tone_mapping=auto
# Overlay ID reserved for rendering thumbnails.
overlay_id=46
# Start the helper mpv as soon as the script loads.
spawn_first=no
# Stop the helper after this many idle seconds; 0 keeps it running.
quit_after_inactivity=0
# Allow thumbnails for network streams.
network=no
# Allow thumbnails for audio-only files.
audio=no
# Use hardware decoding in the thumbnail helper when available.
hwdec=yes
# Path or command used to launch the helper mpv instance.
mpv_path=mpv

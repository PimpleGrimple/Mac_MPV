# ModernX options. Values below are this installed script's defaults unless
# they were already customized in your previous config.

# Language, visibility, and window behavior.
language=en
font=mpv-osd-symbols
layout_option=original
idle_screen=yes
key_bindings=yes
window_top_bar=no
show_windowed=yes
show_fullscreen=yes
show_on_pause=no
keep_on_pause=no
green_and_grumpy=no
visibility=auto

# OSC timing, mouse interaction, and scaling.
hide_timeout=1500
seek_resets_hide_timeout=yes
fade_duration=150
min_mouse_move=0
bottom_hover=yes
bottom_hover_zone=175
osc_on_seek=no
osc_keep_with_cursor=no
mouse_seek_pause=yes
vid_scale=no
scale_windowed=1.3
scale_fullscreen=1.8
scale_forced_window=1.7

# Title, chapters, clock, and description.
show_title=yes
title=${media-title}
title_font_size=28
dynamic_title=yes
show_chapter_title=yes
chapter_fmt=%s
chapter_hover_title=no
chapter_hover_subtitle=yes
show_chapter_markers=yes
chapter_marker_style=gap
show_top_mark=yes
show_bottom_mark=no
time_total=yes
time_ms=no
unicode_minus=no
time_format=dynamic
time_font_size=18
show_description=no
show_file_size=yes
description_font_size=19
description_alpha=100
scrolling_speed=40
date_format=%Y-%m-%d

# Borderless/fullscreen title bar.
window_title=yes
window_controls=yes
window_controls_title=" "

# Subtitle placement while the OSC is visible.
raise_subtitles=no
raise_subtitle_amount=160

# Buttons and playback controls.
compact_mode=yes
jump_buttons=yes
jump_amount=10
jump_more_amount=60
jump_icon_number=yes
jump_mode=relative
jump_softrepeat=yes
chapter_skip_buttons=yes
chapter_softrepeat=no
track_nextprev_buttons=yes
volume_control=yes
volume_control_type=linear
info_button=no
ontop_button=yes
screenshot_button=no
screenshot_flag=subtitles
download_button=yes
download_path=~/Downloads
loop_button=no
loop_in_pause=yes
playpause_size=30
midbuttons_size=24
sidebuttons_size=24

# Colors. Use #RRGGBB values.
osc_color=#000000
window_title_color=#FFFFFF
window_controls_color=#FFFFFF
window_controls_close_hover=#E81123
window_controls_minmax_hover=#53A4FC
title_color=#FFFFFF
seekbarfg_color=#1D96F5
seekbarbg_color=#FFFFFF
seekbar_cache_color=#1D96F5
volumebar_match_seek_color=no
time_color=#FFFFFF
chapter_title_color=#FFFFFF
chapter_marker_color=#1D96F5
chapter_marker_current_color=#9D96f5
side_buttons_color=#FFFFFF
middle_buttons_color=#FFFFFF
playpause_color=#FFFFFF
held_element_color=#999999
hover_effect_color=#FFFFFF
thumbnail_border_color=#FFFFFF
thumbnail_border_outline=#000000

# OSC/background effects and thumbnail frame.
fade_alpha=100
fade_blur_strength=75
fade_transparency_strength=0
window_fade_alpha=100
window_fade_blur_strength=75
window_fade_transparency_strength=0
thumbnail_border=1
thumbnail_border_radius=5
hover_effect=size,glow,color
hover_button_size=115
button_glow_amount=5
hover_effect_for_sliders=no

# Seekbar and persistent-progress behavior.
seek_handle_size=0
seekbar_between_timers=no
seekbar_height=2
progress_bar_height=16
seek_range=yes
seek_range_alpha=175
seekbar_keyframes=yes
automatic_keyframe_mode=yes
automatic_keyframe_limit=1800
persistent_progress_default=no
persistent_progress_height=17
persistent_buffer=no
persistent_progress_toggle=yes

# Web-video integrations.
title_youtube_stats=no
ytdl_format=bv*[height<=1440][format_note!*=?AI-upscaled]+ba/b[height<=1440]/bv*+ba/b
show_sponsorblock_segments=yes
add_sponsorblock_chapters=yes
sponsorblock_seek_range_alpha=75
# JSON list of SponsorBlock categories drawn on the progress bar.
sponsor_types=["sponsor","intro","outro","interaction","selfpromo","preview","music_offtopic","filler"]
sponsorblock_sponsor_color=#00D400
sponsorblock_intro_color=#00FFFF
sponsorblock_outro_color=#0202ED
sponsorblock_interaction_color=#CC00FF
sponsorblock_selfpromo_color=#FFFF00
sponsorblock_preview_color=#008FD6
sponsorblock_music_offtopic_color=#FF9900
sponsorblock_filler_color=#7300FF

# Experimental YouTube-comments and window-on-top workaround.
show_youtube_comments=no
comments_path=~/.config/mpv/cache/scripts/comments
FORCE_fix_not_ontop=no

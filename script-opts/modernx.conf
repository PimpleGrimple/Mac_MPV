# ==============================================================================
# ModernX configuration
# File location: ~~/script-opts/modernx.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# Language and display
# ------------------------------------------------------------------------------

# en:English - .json translations need implementing
language=en

# Font for the OSC (default: mpv-osd-symbols or the one set in mpv.conf)
font=mpv-osd-symbols

# Icon set used by the buttons: "modern", "solid" or "round"
icon_style=modern

# Use the original/reduced layout: "original" or "reduced"
layout_option=original

# Show mpv logo when idle
idle_screen=yes

# Register additional key bindings, such as chapter scrubbing, pinning the window
key_bindings=yes

# Show OSC window top bar: "auto", "yes", or "no" (borderless/fullscreen)
window_top_bar=no

# Show OSC when windowed
show_windowed=yes

# Show OSC when fullscreen
show_fullscreen=yes

# Show OSC when paused
show_on_pause=no

# Disable OSC hide timeout when paused
keep_on_pause=no

# Disable the Santa hat in December
green_and_grumpy=no

# OSC visibility mode: "auto", "always", or "never"
visibility=auto

# ------------------------------------------------------------------------------
# OSC behaviour and scaling
# ------------------------------------------------------------------------------

# Time (in ms) before OSC hides if no mouse movement
hide_timeout=1500

# If seeking should reset the hide_timeout
seek_resets_hide_timeout=yes

# Fade-out duration (in ms), set to 0 for no fade
fade_duration=150

# Minimum mouse movement (in pixels) required to show OSC
min_mouse_move=0

# Show OSC only when hovering at the bottom
bottom_hover=yes

# Height of hover zone for bottom_hover (in pixels)
bottom_hover_zone=175

# Show OSC when seeking
osc_on_seek=no

# Keep OSC visible if mouse cursor is within OSC boundaries
osc_keep_with_cursor=no

# Pause video while seeking with mouse move (on button hold)
mouse_seek_pause=yes

# Scale OSC with the video
vid_scale=no

# OSC scale factor when windowed
scale_windowed=0.7

# OSC scale factor when fullscreen
scale_fullscreen=0.8

# OSC scale factor when forced (no video, for example music files)
scale_forced_window=0.8

# ------------------------------------------------------------------------------
# Time, title and description display
# ------------------------------------------------------------------------------

# Show title in the OSC (above seekbar)
show_title=yes

# Title above seekbar format: "${media-title}" or "${filename}"
title=${media-title}

# Font size of the title text (above seekbar)
title_font_size=28

# Change title if {media-title} and {filename} differ (eg: when playing URLs or audio)
dynamic_title=yes

# Show chapter title alongside timestamp (below seekbar)
show_chapter_title=no

# Format for chapter display on seekbar hover (set to "no" to disable)
chapter_fmt=%s

# Show the hovered chapter's name in place of the main title while scrubbing (only applies when thumbfast isn't available)
chapter_hover_title=no

# Show the hovered chapter's name in the chapter title text below the seekbar instead of the main title (only applies when thumbfast isn't available)
chapter_hover_subtitle=yes

# Show chapter markers on the seekbar
show_chapter_markers=yes

# Shape of chapter markers: "triangle", "bar", "single-bar", or "gap"
chapter_marker_style=triangle

# Show the top part of the chapter marker (only for the "triangle" chapter_marker_style)
show_top_mark=yes

# Show the bottom part of the chapter marker (only for the "triangle" chapter_marker_style)
show_bottom_mark=yes

# Show total time instead of remaining time
time_total=yes

# Show timecodes with milliseconds
time_ms=no

# Use the Unicode minus sign in remaining time
unicode_minus=no

# "dynamic" or "fixed" - dynamic shows MM:SS when possible, fixed always shows HH:MM:SS
time_format=dynamic

# Font size of the time display
time_font_size=18

# Show video description - description on web videos or metadata/stats on local video
show_description=yes

# Show the current file's size in the description
show_file_size=yes

# Font size of the description text (below title)
description_font_size=19

# Alpha of the description background box (0-255)
description_alpha=100

# The speed of scrolling text in description/comment menus
scrolling_speed=40

# How dates should be formatted, when read from metadata (uses standard lua date formatting)
date_format=%Y-%m-%d

# ------------------------------------------------------------------------------
# Title bar settings
# ------------------------------------------------------------------------------

# Show window title in borderless/fullscreen mode
window_title=no

# Show window controls (close, minimize, maximize) in borderless/fullscreen
window_controls=yes

# Title format for window_controls
window_controls_title=" "

# ------------------------------------------------------------------------------
# Subtitle display settings
# ------------------------------------------------------------------------------

# Whether to raise subtitles above the OSC when it's shown
raise_subtitles=yes

# How much subtitles rise when the OSC is shown
raise_subtitle_amount=100

# ------------------------------------------------------------------------------
# Buttons display and functionality
# ------------------------------------------------------------------------------

# Replace the jump buttons with the seek/chapter buttons
compact_mode=no

# Show the jump backward and forward buttons
jump_buttons=no

# Change the jump amount in seconds
jump_amount=5

# Change the jump amount in seconds when right-clicking jump buttons and shift-clicking chapter skip buttons
jump_more_amount=87

# Show different icon when jump_amount is set to 5, 10, or 30
jump_icon_number=yes

# Seek mode for jump buttons: "exact" or "relative"
jump_mode=exact

# Enable continuous jumping when holding down seek buttons
jump_softrepeat=yes

# Show the chapter skip backward and forward buttons
chapter_skip_buttons=yes

# Enable continuous skipping when holding down chapter skip buttons
chapter_softrepeat=no

# Show next/previous playlist track buttons
track_nextprev_buttons=yes

# Show mute button and volume slider
volume_control=yes

# Show the volume slider (requires volume_control)
volume_slider=yes

# Volume scale type: "linear" or "logarithmic"
volume_control_type=linear

# Show info button
info_button=no

# Show window on top button
ontop_button=no

# Show screenshot button
screenshot_button=no

# Flag for screenshot button: "subtitles", "video", "window", "each-frame"
# https://mpv.io/manual/master/#screenshot-commands
screenshot_flag=subtitles

# Show download button on web videos (requires yt-dlp and ffmpeg)
download_button=yes

# Default download directory for videos (https://mpv.io/manual/master/#paths)
download_path=~/Downloads

# Show loop button
loop_button=no

# Enable looping by right-clicking pause
loop_in_pause=yes

# Icon size for the play/pause button
playpause_size=30

# Icon size for the middle buttons
midbuttons_size=24

# Icon size for the side buttons
sidebuttons_size=24

# ------------------------------------------------------------------------------
# Colors and style (Hex #RRGGBB)
# ------------------------------------------------------------------------------

# Accent color of the OSC and title bar
osc_color=#000000

# Color of the title in borderless/fullscreen mode
window_title_color=#FFFFFF

# Color of the window controls (close, minimize, maximize) in borderless/fullscreen mode
window_controls_color=#FFFFFF

# Color of close window control on hover
window_controls_close_hover=#E81123

# Color of min/max window controls on hover
window_controls_minmax_hover=#53A4FC

# Color of the title (above seekbar)
title_color=#FFFFFF

# Color of the seekbar progress and handle
seekbarfg_color=#1D96F5

# Color of the remaining seekbar
seekbarbg_color=#FFFFFF

# Color of the cache ranges on the seekbar
seekbar_cache_color=#1D96F5

# Match volume bar color with seekbar color (ignores side_buttons_color)
volumebar_match_seek_color=no

# Color of the timestamps (below seekbar)
time_color=#FFFFFF

# Color of the chapter title next to timestamp (below seekbar)
chapter_title_color=#FFFFFF

# Color of chapter markers on the seekbar
chapter_marker_color=#1D96F5

# Color of the marker for the current chapter
chapter_marker_current_color=#9D96f5

# Color of the side buttons (audio, subtitles, playlist, etc.)
side_buttons_color=#FFFFFF

# Color of the middle buttons (skip, jump, chapter, etc.)
middle_buttons_color=#FFFFFF

# Color of the play/pause button
playpause_color=#FFFFFF

# Color of the element when held down (pressed)
held_element_color=#999999

# Color of a hovered button when hover_effect includes "color"
hover_effect_color=#FFFFFF

# Color of the border for thumbnails (with thumbfast)
thumbnail_border_color=#FFFFFF

# Color of the border outline for thumbnails
thumbnail_border_outline=#000000

# Alpha of the title bar background box (0-255)
fade_alpha=100

# Blur strength for the OSC alpha fade, higher values have a smoother fade effect
fade_blur_strength=75

# Use with "fade_blur_strength = 0" to create a transparency box
fade_transparency_strength=0

# Alpha of the window title bar (0-255)
window_fade_alpha=100

# Blur strength for the window title bar, higher values have a smoother fade effect
window_fade_blur_strength=75

# Use with "window_fade_blur_strength = 0" to create a transparency box
window_fade_transparency_strength=0

# Width of the thumbnail border (for thumbfast)
thumbnail_border=1

# Rounded corner radius for thumbnail border (0 to disable)
thumbnail_border_radius=5

# ------------------------------------------------------------------------------
# Button hover effects
# ------------------------------------------------------------------------------

# Active button hover effects: "glow", "size", "color"; can use multiple separated by commas
hover_effect=size,glow,color

# Relative size of a hovered button if "size" effect is active
hover_button_size=115

# Glow intensity when "glow" hover effect is active
button_glow_amount=5

# Apply hover effects to slider handles
hover_effect_for_sliders=no

# ------------------------------------------------------------------------------
# Progress bar settings
# ------------------------------------------------------------------------------

# Size ratio of the seekbar handle (range: 0 ~ 1, 0 disables handle)
seek_handle_size=0

# Moves the seekbar and progress bar between the timers
seekbar_between_timers=yes

# Height of the seekbar
seekbar_height=2

# Height of the progress bar
progress_bar_height=16

# Show seek range overlay
seek_range=yes

# Transparency of the seek range (0-255)
seek_range_alpha=175

# Use keyframes when dragging the seekbar
seekbar_keyframes=yes

# Automatically set seekbar_keyframes for the seekbar based on video length defined in automatic_keyframe_limit
automatic_keyframe_mode=yes

# Videos longer than this (in seconds) will have seekbar_keyframes set to true
automatic_keyframe_limit=1800

# Always show a small progress line at the bottom of the screen
persistent_progress_default=no

# Height of the persistent_progress bar
persistent_progress_height=17

# Show the buffer on the persistent progress line
persistent_buffer=no

# Enable toggling the persistent_progress bar
persistent_progress_toggle=yes

# ------------------------------------------------------------------------------
# Web videos
# ------------------------------------------------------------------------------

# Update the window/OSC title bar with YouTube video stats (views, comments, likes)
title_youtube_stats=yes

# Optional parameters for yt-dlp downloading (eg: '-f bestvideo+bestaudio/best')
ytdl_format=bv*[height<=1440][format_note!*=?AI-upscaled]+ba/b[height<=1440]/bv*+ba/b

# ------------------------------------------------------------------------------
# Skippable segments & SponsorBlock
# ------------------------------------------------------------------------------

# Show SponsorBlock and skippable segments on the progress bar
show_sponsorblock_segments=yes

# Add SponsorBlock chapters to the chapter list
add_sponsorblock_chapters=yes

# Transparency of skippable segments on seekbar (0-255)
sponsorblock_seek_range_alpha=75

# What categories to show in the progress bar (JSON array)
# All supported categories: sponsor, intro, outro, interaction, selfpromo, preview, music_offtopic, filler, opening, ending, credits
sponsor_types=["sponsor","intro","outro","interaction","selfpromo","preview","music_offtopic","filler","opening","ending","credits"]

# Color for sponsors
sponsorblock_sponsor_color=#00D400

# Color for intermission/intro animations
sponsorblock_intro_color=#00FFFF

# Color for endcards/outro
sponsorblock_outro_color=#0202ED

# Color for interaction reminders (reminders to subscribe)
sponsorblock_interaction_color=#CC00FF

# Color for unpaid/self promotion
sponsorblock_selfpromo_color=#FFFF00

# Color for video previews
sponsorblock_preview_color=#008FD6

# Color for silence / non-music in music videos
sponsorblock_music_offtopic_color=#FF9900

# Color for filler content / tangents
sponsorblock_filler_color=#7300FF

# Color for anime opening segments (falls back to intro_color if not set)
sponsorblock_opening_color=#00FFFF

# Color for anime ending segments (falls back to outro_color if not set)
sponsorblock_ending_color=#0202ED

# Color for credits segments (falls back to outro_color if not set)
sponsorblock_credits_color=#0202ED

# Show the segment type name under the seekbar hover time/thumbnail
show_sponsorblock_segment_name_on_hover=no

# Temporarily show the segment type name where the chapter title would be while hovering
show_sponsorblock_segment_name_in_chapter_title_on_hover=yes

# ------------------------------------------------------------------------------
# Experimental
# ------------------------------------------------------------------------------

# EXPERIMENTAL - show YouTube comments
show_youtube_comments=yes

# EXPERIMENTAL - the download path for the comment JSON file
comments_path=~/Pictures/mpv/comments

# EXPERIMENTAL - try and mitigate window ontop issues
FORCE_fix_not_ontop=no

# Keys are registered by the script itself (Ctrl+R menu, Ctrl+Alt+r export),
# so there is no key option here.
# Export directory; empty writes next to the source file.
output_dir=
# Commands or absolute paths; empty values are auto-detected.
ffmpeg=
ffprobe=
# Output container: mkv, mp4, mov, or mka.
container=mkv
# Convert text subtitles for containers that need it.
convert_text_subs=no
# Preserve input stream timing in the export.
apply_timing=yes
# Remux card look (scripts/remux/style.lua). A style profile (styles.conf) overrides these live;
# they apply when no profile is active. Colours are RGB hex, alphas are ASS hex (00 solid ... FF invisible).
width=680
anchor=top-right
margin=30
# Empty font = the OSD font.
font=
radius=14
pill_radius=9
# Text outline width.
outline=0.7
bg_color=111111
bg_alpha=14
border_color=d4baff
border_alpha=78
accent_color=9b5de5
# Text/tick drawn ON the accent fill (Export button, checkboxes): white on dark accents, dark on light ones.
accent_text_color=ffffff
text_color=f2f2f2
desc_color=9a9a9a
text_border_color=111111
# Status colours.
ok_color=4ADE80
warn_color=F5A524
bad_color=F87171

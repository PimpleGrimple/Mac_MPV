# Keys are registered by the script itself (Ctrl+R menu, Ctrl+Alt+r export),
# so there is no key option here.
# Export directory; empty writes next to the source file.
output_dir=
# Commands or absolute paths; empty values are auto-detected.
ffmpeg=
ffprobe=
# Output container: mkv, mp4, mov, or mka.
container=mkv
# Convert text subtitles for containers that need it.
convert_text_subs=no
# Preserve input stream timing in the export.
apply_timing=yes
# Remux-card overrides. Shared visual options live in menu.conf.
width=680
anchor=
bg_alpha=14

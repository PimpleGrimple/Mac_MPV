ytdl_path=/opt/homebrew/bin/yt-dlp
# Comma-separated sites/URL prefixes never passed to yt-dlp.
exclude=
# URL prefixes passed to yt-dlp before normal stream opening.
include=^%w+%.youtube%.com/|^youtube%.com/|^youtu%.be/|^%w+%.twitch%.tv/|^twitch%.tv/
# Try yt-dlp before mpv's normal URL handling for matching sites.
#try_ytdl_first=no
# Let yt-dlp return manifest URLs when available.
use_manifests=no
# Request every available format from yt-dlp.
all_formats=yes
# Force all_formats even when selecting an explicit ytdl-format.
force_all_formats=yes
# Thumbnail mode: none, best, or all.
thumbnails=none

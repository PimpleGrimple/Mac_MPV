# Built-in select.lua options (mpv 0.41).
# This script powers the default file/playlist/history pickers.

# Date format for entries in the input history (Lua os.date format).
history_date_format=%Y-%m-%d %H:%M:%S

# Show each path only once in the history, using its most recent entry.
hide_history_duplicates=yes

# Menu definition used for the native context menu. Falls back to mpv's
# built-in default-menu when the file is missing.
menu_conf_path=~~/menu.conf

# Maximum number of items listed in the playlist and audio-device submenus.
max_playlist_items=25

# Fill the native context-menu labels with live data (track names, flags, etc.).
populate_menu_data=yes

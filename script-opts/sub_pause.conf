# Enable pausing at subtitle starts / ends when the script is toggled on.
default_start=no
default_end=no
# Seconds before a subtitle ends at which the end pause is triggered.
end_delta=0.1
# Hide subtitles during playback and show them again while paused.
hide_while_playing=no
# Automatically resume after this many seconds; 0 disables automatic resume.
unpause_time=0
# Key that cancels an active automatic-resume timer.
unpause_override=SPACE
# When replaying with no current subtitle, step back to the previous subtitle.
replay_prev=yes

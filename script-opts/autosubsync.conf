# Absolute paths to tools for macOS Homebrew
ffmpeg_path=/opt/homebrew/bin/ffmpeg
# Leave empty to let the script locate ffsubsync automatically.
ffsubsync_path=
alass_path=/opt/homebrew/bin/alass

# Preferred synchronization engine: 'alass', 'ffsubsync', or 'ask'
audio_subsync_tool=alass
altsub_subsync_tool=alass

# Alass tuning (prevents false multi-minute jumps on dubbed audio/cuts; default 20)
alass_split_penalty=20
# Fallback encoding if subtitle is not valid UTF-8
alass_fallback_encoding=windows-1252
# Additional CLI flags to pass to alass
alass_extra_args=

# Unload original subtitles after syncing (yes, no)
unload_old_sub=yes

# Menu look (style.lua). A style profile (styles.conf) overrides these live; they apply when no profile is active.
# Colours are RGB hex, alphas are ASS hex (00 solid ... FF invisible). Empty = built-in default.
# The style picker (styles.lua) is drawn by the same menu and uses these values too.
bg_color=111111
bg_alpha=90
border_color=d4baff
border_alpha=60
accent_color=9b5de5
text_color=ffffff
desc_color=AAAAAA
text_border_color=111111
blur=15
shadow=0
radius=12
pill_radius=8
bold=no
# Empty font = the OSD font.
font=
anchor=top-right
margin=30

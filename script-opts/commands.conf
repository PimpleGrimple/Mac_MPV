# Built-in commands.lua options (mpv 0.41).
# This is the command palette opened with `script-binding commands/open`.

# Save the command history between mpv sessions.
persist_history=no

# History file used when persist_history=yes. `~~state` is mpv's state dir.
history_path=~~state/command_history.txt

# Restore the last command (and cursor position) when the palette reopens.
remember_input=yes

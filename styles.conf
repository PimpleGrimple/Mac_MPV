# The menu name comes from profile-desc, written as "Name (description)"; the first profile is the default.
# mpv has to load this file for the profiles to exist, so mpv.conf needs the line:  include=~~/styles.conf
# (Alternatively paste everything into the END of mpv.conf and name the sections style-<name>.)
#
# Every profile must set the SAME keys: applying a profile only writes what it lists, so a key one profile
# leaves out keeps the value of the previous one.
#
# SCRIPT LOOKS. These are ordinary options of the scripts: the same names work in their own conf
# (autosubsync.conf, remux.conf), and a profile overrides them live as <script>-<option> script-opts.
# Colours are RGB hex, alphas are ASS hex (00 solid ... FF invisible).
#
#   autosubsync-<option>=value   the autosubsync menu, and the style picker (styles.lua), which is drawn by the same menu
#       bg_color bg_alpha border_color border_alpha accent_color blur shadow radius pill_radius
#       text_color desc_color text_border_color bold      (+ font font_size rect_width max_rows anchor margin ...,
#       the full list is SCHEMA at the top of autosubsync/style.lua)
#
#   remux-<option>=value         the remux card (scripts/remux/style.lua)
#       accent_color accent_text_color bg_color bg_alpha border_color border_alpha text_color desc_color
#       text_border_color ok_color warn_color bad_color radius pill_radius outline  (+ font width anchor margin)
#       accent_text_color is the text/tick drawn ON the accent fill: white on dark accents, dark on light ones.
#
#   The font of both follows osd-font from the profile unless font= is set.

[mystyle]
profile-desc="Default (Helvetica Neue + Purple)"
# Subtitles
sub-font="Helvetica Neue"
sub-font-size=38
sub-color="#FFFFFFFF"
sub-border-color="#FF000000"
sub-border-size=1.65
sub-shadow-offset=1.0
sub-shadow-color="#AF000000"
sub-border-style=outline-and-shadow
sub-blur=0.5
sub-bold=no
sub-italic=no
sub-spacing=0
sub-margin-y=40

# OSD
osd-font="Helvetica Neue"
osd-font-size=26
osd-color="#FFFFFFFF"
osd-border-color="#FF000000"
osd-border-size=1.65
osd-shadow-offset=1.0
osd-shadow-color="#AF000000"

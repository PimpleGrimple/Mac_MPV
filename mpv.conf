# =====
# Core
# =====
vo=gpu-next
gpu-api=vulkan
gpu-context=macvk
macos-render-timer=feedback
hwdec=videotoolbox
hwdec-codecs=h264,hevc,vp9,prores
#swapchain-depth=1
#vulkan-device=Apple M2
#vulkan-queue-count=4
#vd-lavc-threads=4
#vd-lavc-fast=yes
#vd-lavc-dr=yes
#demuxer-readahead-secs=10
demuxer-max-bytes=300MiB
demuxer-max-back-bytes=200MiB
#cache-secs=10
#cache-pause=no
#cache-pause-wait=5
#cache-pause-initial=yes
#vd-queue-enable=yes
#vd-queue-max-samples=300
#vd-queue-max-secs=30
#vd-queue-max-bytes=300MiB
#untimed
#framedrop=no
#hr-seek=yes
#hr-seek-framedrop=no
disc-menu=yes
#use-filedir-conf=yes
#macos-app-activation-policy=accessory
macos-menu-shortcuts=yes
input-ar-rate=9
input-ar-delay=300
input-media-keys=yes
input-right-alt-gr=no
input-builtin-bindings=no
#input-default-bindings=no
#input-conf="~~/mess.conf"
#input-commands-append=load-input-conf ~~/mess.conf
include="~~/styles.conf"
log-file="~~/cache/mpv.txt"
icc-cache-dir="~~/cache/icc"
gpu-shader-cache-dir="~~/cache/shaders"
watch-later-dir="~~/cache/watch_later"
watch-history-path="~~/cache/watch_history.jsonl"
#msg-level=all=v

# ======
# Video
# ======
target-colorspace-hint=yes
target-colorspace-hint-strict=no
target-prim=display-p3
target-gamut=display-p3
target-trc=srgb
treat-srgb-as-power22=no
target-contrast=1300
#gamma-factor=1.12
video-sync=display-resample
scale=ewa_hanning
scale-blur=0.9753886283057314
#scale-antiring=0.6
sigmoid-upscaling=yes
dscale=mitchell
linear-downscaling=yes
correct-downscaling=yes
cscale=ewa_hanning
cscale-blur=0.9753886283057314
#cscale-antiring=0.6
dither=no
deband-iterations=1
deband-threshold=50
deband-range=16
deband-grain=16

# ======
# Audio
# ======
audio-file-auto=fuzzy
alang=chi,ko,ja,en
ao=coreaudio #avfoundation
#audio-buffer=0.5
replaygain=track
replaygain-fallback=-4
replaygain-clip=no
#gapless-audio=yes
#initial-audio-sync=no

# =========
# Subtitle
# =========
sub-auto=fuzzy
sub-file-paths-append=ass:srt:sub:subs:subtitles #"path"
slang=en,eng
subs-fallback=yes
sub-scale=0.8
sub-pos=100
secondary-sub-pos=0
blend-subtitles=yes
sub-use-margins=no
sub-fix-timing=yes
#sub-scale-by-window=no
sub-scale-with-window=no
#sub-ass-scale-with-window=yes
sub-hdr-peak=100
image-subs-hdr-peak=100
#sub-ass-use-video-data=none #all, none, aspect-ratio
#sub-ass-style-overrides-append=PlayResY=600,FontSize=70
#demuxer-mkv-subtitle-preroll=yes
#demuxer-mkv-subtitle-preroll-secs=2

# =========
# Playlist
# =========
#loop-playlist=yes
prefetch-playlist=yes
autocreate-playlist=filter #same
directory-filter-types=video,audio,image
directory-mode=ignore #lazy
autoload-files=yes
image-display-duration=inf
save-watch-history=yes
save-position-on-quit=yes
reset-on-next-file=panscan,deband,video-crop,glsl-shaders
write-filename-in-watch-later-config=yes
#ignore-path-in-watch-later-config=yes
watch-later-options=start,volume,audio-delay,panscan,vid,aid,sid,sub-delay,sub-ass-override,video-crop,deband
#watch-later-options-clr

# ===========
# Screenshot
# ===========
screenshot-format=png
screenshot-png-compression=9
#screenshot-jpeg-quality=99
#screenshot-jpeg-source-chroma=no
#screenshot-avif-encoder=libsvtav1
#screenshot-tag-colorspace=no
#screenshot-sw=yes
screenshot-high-bit-depth=yes
screenshot-dir=~/Pictures/mpv/screenshots
screenshot-template='%tY-%tm-%td_%P' #%02n

# =====
# zimg
# =====
sws-allow-zimg=yes
zimg-threads=auto
zimg-fast=no
zimg-scaler=spline36 #lanczos,bicubic
zimg-scaler-param-a=default
zimg-scaler-param-b=default
zimg-scaler-chroma=spline36 #lanczos,bicubic
zimg-scaler-chroma-param-a=default
zimg-scaler-chroma-param-b=default
zimg-dither=error-diffusion #no,ordered,random

# =======
# Window
# =======
fs=yes
#native-fs=no
macos-fs-animation-duration=0
#macos-geometry-calculation=whole #visible
macos-title-bar-appearance=vibrantDark
macos-title-bar-material=popover
#hidpi-window-scale=yes
force-window-position=yes
force-window=yes #immediate
focus-on=open
window-dragging=no
#keep-open=yes
idle=once
autofit=70%x70% #1920x1080
border=no
#border-background=blur
osc=no
osd-bar=no
osd-margin-y=18
osd-duration=2000
cursor-autohide=2000

# =========
# Profiles
# =========
[battery]
profile-restore=copy
video-sync=audio
scale=spline36 #catmull_rom
scale-blur=1
scale-antiring=0
sigmoid-upscaling=no
linear-upscaling=yes
dscale=hermite
cscale=spline36 
cscale-blur=1
cscale-antiring=0
interpolation=no
#deband=no
blend-subtitles=no
glsl-shaders=""
vf=""

[meme]
glsl-shaders-append="~~/shaders/CfL/CfL_Prediction_RT.glsl"
glsl-shaders-append="~~/shaders/RAISR/ravu/rgba16hf/zoom/ravu-zoom-ar-r3.hook"

[pixart]
scale=oversample
dscale=mitchell
cscale=oversample
sigmoid-upscaling=no
linear-upscaling=yes

[image-contrast]
profile-cond=get("current-tracks/video/image", false)
profile-restore=copy
target-contrast=inf

[Gif]
profile-cond=get("duration", 0) > 0 and get("duration") <= 10
profile-restore=copy
loop=inf

[widescreen]
profile-cond=width and height and width/height > 1.7 and p["native-fs"] ~= false
profile-restore=copy
video-pan-y=-0.013 #0.057

[Smooth-Motion]
profile-cond=(function() local fps = get("estimated-vf-fps", 0); local hz = 60 ; if fps <= 0 or hz <= 0 then return false end; local n = math.max(1, math.floor(hz / fps + 0.5)); return math.abs(hz / (fps * n) - 1) > 0.01 end)()
profile-restore=copy
video-sync=display-resample
interpolation=yes
tscale=oversample
#tscale=sphinx
#tscale-blur=0.6991556596428412
#tscale-radius=1.01

[Streams]
profile-cond=demuxer_via_network
profile-restore=copy
cookies-file=~~/cache/scripts/cookies.txt
user-agent="Mozilla/5.0"
force-seekable=yes
cache-secs=10

[MV]
profile-cond=p.path and (p.path:find("/Music/"))
profile-restore=copy
video-sync=audio #display-desync
sid=no
speed=1
shuffle=yes
loop-playlist=yes
ao=avfoundation
audio-pitch-correction=no
watch-later-options=volume,audio-delay,panscan,vid,aid,sid,sub-delay,sub-ass-override,video-crop,deband
script-opts-append=replaygain-auto_scan=true
script-opts-append=replaygain-auto_bake=true
script-opts-append=subtitles-auto_download=no

[spatial-audio]
profile-cond=get("audio-params/channel-count", 0) > 2
profile-restore=copy
ao=avfoundation

[fallback-cover]
cover-art-files-append=~~/cover.webp
[extension.flac]
profile=fallback-cover
[extension.opus]
profile=fallback-cover
[extension.mp3]
profile=fallback-cover
[extension.wav]
profile=fallback-cover

[HDR]
profile-cond=p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg"
profile-restore=copy
target-peak=500
target-contrast=1000
#tone-mapping=bt.2446a
#tone-mapping-param=0.25
#[DTM]
#hdr-compute-peak=no
#allow-delayed-peak-detect=yes
hdr-peak-percentile=99.995
hdr-peak-decay-rate=120
hdr-scene-threshold-low=6
hdr-scene-threshold-high=12
hdr-contrast-recovery=0.30
gamut-mapping-mode=perceptual
screenshot-format=avif
screenshot-tag-colorspace=yes

[DolbyVision]
profile-cond=get("video-params/colormatrix") == "dolbyvision" or (filename ~= nil and (filename:lower():find("dovi") ~= nil or filename:lower():find("dolbyvision") ~= nil or filename:lower():find("dolby.vision") ~= nil or filename:lower():match("[%.%-_]dv[%.%-_]") ~= nil))
profile-restore=copy
tone-mapping=spline
hdr-compute-peak=no

[HDR10+]
profile-cond=get("video-params/scene-max-r", 0) > 0
profile-restore=copy
tone-mapping=st2094-40
hdr-compute-peak=no

[Inverse-TM]
profile-cond=p["inverse-tone-mapping"] == true
profile-restore=copy
target-peak=300
tone-mapping=spline
hdr-compute-peak=no

[4k]
profile-cond=width and height and (width >= 3840 or height >= 2160) and not get("user-data/battery", false)
profile-restore=copy
dscale=mitchell
linear-downscaling=no
glsl-shaders-append=~~/shaders/SSim/SSimDownscaler_RT.glsl

[SD-clean]
profile-cond=width and height and (width * height) >= 450000 and (width * height) <= 1228800 and not (get("path", ""):sub(1, 6) == "dvd://") and not get("user-data/deint", false) and not get("user-data/battery", false)
profile-restore=copy
deband-iterations=1
deband-threshold=50
deband-range=16
deband-grain=16
glsl-shaders-append="~~/shaders/ArtCNN/C4F16/ArtCNN_C4F16.glsl"

[SD-restore]
profile-cond=width and height and (width * height) < 450000 and not (get("path", ""):sub(1, 6) == "dvd://") and not get("user-data/deint", false) and not get("user-data/battery", false)
profile-restore=copy
deband=yes
deband-iterations=2
deband-threshold=60
deband-range=16
deband-grain=32
#glsl-shaders-append=~~/shaders/Anime4K/Denoise/Anime4K_Denoise_Bilateral_Median.glsl
#glsl-shaders-append=~~/shaders/ArtCNN/C4F16/ArtCNN_C4F16.glsl
glsl-shaders-append="~~/shaders/ArtCNN/C4F16/ArtCNN_C4F16_DS.glsl"
#glsl-shaders-append="~~/shaders/ArtCNN/C4F16/ArtCNN_C4F16_DN.glsl"
#glsl-shaders-append="~~/shaders/nlmeans/nlmeans.glsl"
#glsl-shaders-append=~~/shaders/ACNet/HDN/ARNet_F8B8_hdn.glsl
#glsl-shaders-append="~~/shaders/AMD/CAS/AMD_CAS_luma_RT.glsl"
#glsl-shaders-append=~~/shaders/Adaptive-sharpen/Adaptive_sharpen_RT.glsl
#glsl-shaders-append=~~/shaders/Anime4K/Experimental-Effects/Anime4K_Thin_HQ.glsl

[SD-DVD]
profile-cond=get("path", ""):sub(1, 6) == "dvd://" and not get("user-data/battery", false)
profile-restore=copy
blend-subtitles=video
sub-gauss=0.9
deband=yes
deband-iterations=1
deband-threshold=50
deband-range=16
deband-grain=16
#glsl-shaders-append=~~/shaders/ETC/FineDehalo_lite_RT.glsl
#glsl-shaders-append=~~/shaders/plane/plane_shift_yuv_RT.glsl
glsl-shaders-append=~~/shaders/ArtCNN/C4F16/ArtCNN_C4F16.glsl

[Sharpen]
profile-restore=copy
deband=yes
deband-iterations=2
deband-threshold=50
deband-range=16
deband-grain=16
#sharpen=1
#glsl-shaders-append=~~/shaders/Adaptive-sharpen/Adaptive_sharpen_RT.glsl
glsl-shaders-append="~~/shaders/AMD/CAS/AMD_CAS_luma_RT.glsl"

[deband-8bit]
profile-cond=((({yuv420p=true, yuvj420p=true, yuv422p=true, yuv444p=true, nv12=true})[get("video-params/pixelformat", "")] or ({yuv420p=true, yuvj420p=true, yuv422p=true, yuv444p=true, nv12=true})[get("video-params/hw-pixelformat", "")]))
profile-restore=copy
deband=yes
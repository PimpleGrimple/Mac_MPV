# =====
# Core
# =====
vo=gpu-next
gpu-api=vulkan
gpu-context=macvk
#vulkan-device=Apple M2
hwdec=videotoolbox
#hwdec-codecs=h264,hevc,vp9,prores
vd-lavc-dr=yes
#demuxer-readahead-secs=10
demuxer-max-bytes=300MiB
demuxer-max-back-bytes=200MiB
#cache-secs=10
#cache-pause=no
#cache-pause-wait=5
#cache-pause-initial=yes
#vd-queue-enable=yes
#vd-queue-max-samples=300
#vd-queue-max-secs=30
#vd-queue-max-bytes=300MiB
#hr-seek=yes
#hr-seek-framedrop=no
input-ar-delay=400 
input-ar-rate=6
#profile=Latency

# ======
# Video
# ======
target-colorspace-hint=yes
target-colorspace-hint-strict=no
target-gamut=display-p3
target-prim=display-p3
target-trc=srgb
treat-srgb-as-power22=no
target-contrast=1300
#gamma-factor=1.12
video-sync=display-resample
interpolation=yes
tscale=oversample
scale=ewa_hanning
scale-blur=0.9753886283057314
#linear-upscaling=yes
sigmoid-upscaling=yes
#glsl-shaders-append="~~/shaders/RAISR/ravu/Gather/ravu-zoom-ar-r3.glsl"
dscale=mitchell
linear-downscaling=yes
correct-downscaling=yes
cscale=ewa_hanning
cscale-blur=0.9753886283057314
#dither-depth=no
deband-iterations=3
deband-threshold=46
deband-range=24
deband-grain=24

# ======
# Audio
# ======
replaygain=track
audio-file-auto=fuzzy
replaygain-fallback=-5
alang=chi,ko,ja,en

# =========
# Subtitle
# =========
sub-auto=fuzzy
sub-file-paths-append=ass:srt:sub:subs:subtitles #"path"
slang=full,eng
subs-fallback=yes
blend-subtitles=yes
sub-use-margins=no
sub-scale-by-window=yes
sub-scale-with-window=yes
sub-ass-scale-with-window=yes
secondary-sub-pos=0
sub-hinting=light
sub-fix-timing=yes
image-subs-hdr-peak=100
sub-hdr-peak=100
#demuxer-mkv-subtitle-preroll=yes
demuxer-mkv-subtitle-preroll-secs=2

# =========
# Playlist
# =========
loop-playlist=yes
prefetch-playlist=yes
autocreate-playlist=filter
directory-filter-types=video,audio,image
directory-mode=lazy
autoload-files=yes
image-display-duration=inf
save-watch-history=yes
save-position-on-quit=yes
reset-on-next-file=panscan,deband,video-crop
write-filename-in-watch-later-config=yes
#ignore-path-in-watch-later-config=yes
watch-later-options=start,speed,volume,audio-delay,panscan,aid,vid,sid,sub-delay,sub-ass-override,deband,video-crop
#watch-later-options-clr

# ===========
# Screenshot
# ===========
#screenshot-sw=yes
#screenshot-format=jpg
#screenshot-jpeg-quality=99
#screenshot-jpeg-source-chroma=no
screenshot-png-compression=9
#screenshot-tag-colorspace=no
screenshot-dir=~/Pictures/mpv/screenshots
screenshot-template='%tY-%tm-%td_%P' #%02n

# =======
# Window
# =======
fs=yes
#native-fs=no
macos-fs-animation-duration=0
force-window-position=yes
force-window=yes
#geometry=50%:40%
autofit=73%x73% #1920x1080
border=no
osc=no
osd-bar=no
osd-duration=2000
cursor-autohide=2000
#idle=no
#keep-open=yes

# ======
# Paths
# ======
icc-cache-dir="~~/cache/icc"
gpu-shader-cache-dir="~~/cache/shaders"
watch-later-dir="~~/cache/watch_later"
watch-history-path="~~/cache/watch_history.jsonl"
script-opts-append=ytdl_hook-ytdl_path=/opt/homebrew/bin/yt-dlp
#use-filedir-conf=yes
#input-builtin-bindings=no
#input-conf="~~/mess.conf"
include="~~/styles.conf"
#include="~~/profiles.conf"
#log-file="~~/cache/mpv.txt"
#msg-level=all=v

# =========
# Profiles
# =========
[HDR]
profile-cond=p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg"
profile-restore=copy
target-peak=500
# [DTM] #
#tone-mapping=bt.2446a
#tone-mapping-param=0.25
hdr-compute-peak=no
#allow-delayed-peak-detect=yes
hdr-peak-percentile=99.995
hdr-peak-decay-rate=120
hdr-scene-threshold-low=6
hdr-scene-threshold-high=12
hdr-contrast-recovery=0.30
gamut-mapping-mode=perceptual
screenshot-format=avif

[DolbyVision]
profile-cond=get("video-params/colormatrix") == "dolbyvision" or (filename ~= nil and (filename:lower():find("dovi") ~= nil or filename:lower():find("dolbyvision") ~= nil or filename:lower():find("dolby.vision") ~= nil or filename:lower():match("[%.%-_]dv[%.%-_]") ~= nil))
profile-restore=copy
tone-mapping=spline
hdr-compute-peak=no

[HDR10+]
profile-cond=get("video-params/scene-max-r", 0) > 0
profile-restore=copy
tone-mapping=st2094-40
hdr-compute-peak=no

[Inverse-TM]
profile-cond=p["inverse-tone-mapping"] == true
profile-restore=copy
target-peak=300
tone-mapping=spline
hdr-compute-peak=no

[4k]
#profile-cond=width >= 3840 or height >= 2160
profile-restore=copy
glsl-shaders-clr
glsl-shaders-append=~~/shaders/SSim/SSimDownscaler_RT.glsl
linear-downscaling=no
dscale-antiring=0

[SD-clean]
profile-cond=p.path and not p.path:find("%vsprocessed%.") and width and height and (width * height) >= 450000 and (width * height) <= 1228800 and (not p["user-data/cadence"] or p["user-data/cadence"] == "progressive" or p["user-data/cadence"] == "soft_telecine") and p["user-data/battery"] ~= "yes"
profile-restore=copy
glsl-shaders-clr
glsl-shaders-append=~~/shaders/FSRCNNX/Standard/FSRCNNX_x2_8_0_4_1.glsl
deband=yes

[SD-restore]
profile-cond=p.path and not p.path:find("%vsprocessed%.") and width and height and (width * height) < 450000 and (not p["user-data/cadence"] or p["user-data/cadence"] == "progressive" or p["user-data/cadence"] == "soft_telecine") and p["user-data/battery"] ~= "yes"
profile-restore=copy
glsl-shaders-clr
glsl-shaders-append="~~/shaders/ACNet/HDN/ARNet_F8B8_hdn.glsl"
deband=yes

[SD-DVD]
profile-cond=(p["user-data/cadence"] == "telecine" or p["user-data/cadence"] == "interlaced" or p["user-data/cadence"] == "mix") and p["user-data/battery"] ~= "yes"
profile-restore=copy
glsl-shaders-clr
#glsl-shaders-append=~~/shaders/Anime4K/Denoise/Anime4K_Denoise_Bilateral_Median.glsl
#glsl-shaders-append=~~/shaders/ETC/FineDehalo_lite_RT.glsl
#glsl-shaders-append=~~/shaders/plane/plane_shift_yuv_RT.glsl
glsl-shaders-append=~~/shaders/ArtCNN/C4F16/ArtCNN_C4F16.glsl
#glsl-shaders-append=~~/shaders/AMD/CAS/AMD_CAS_luma_RT.glsl
#glsl-shaders-append=~~/shaders/SSim/SSimSuperRes_RT.glsl
deband=yes
sub-gauss=0.8

[Smooth-Motion]
video-sync=display-resample
interpolation=yes
tscale=sphinx
tscale-blur=0.6991556596428412
tscale-radius=1.01

[widescreen]
profile-cond=width/height >= 1.7
video-pan-y=-0.013

[Streams]
profile-cond=demuxer_via_network
profile-restore=copy
cookies-file=~~home/cache/scripts/cookies.txt
force-seekable=yes
cache-secs=10

[Latency]
untimed
stream-buffer-size=4k
swapchain-depth=1
vulkan-queue-count=1
vulkan-swap-mode=immediate
vd-lavc-fast=yes
vd-lavc-threads=1
demuxer-lavf-o-add=fflags=+nobuffer
demuxer-lavf-probe-info=nostreams
demuxer-lavf-analyzeduration=0.1
audio-pitch-correction=no
video-latency-hacks=yes
gapless-audio=yes
audio-buffer=0
cache-pause=no
video-sync=audio
interpolation=no
macos-fs-animation-duration=0
force-window=immediate

[jpg-fix]
profile-cond=filename ~= nil and filename:match("%.jpe?g$") ~= nil
profile-restore=copy
vf-add=format=colorlevels=limited

[Gif]
profile-cond=get("duration", 0) > 0 and get("duration") <= 10
profile-restore=copy
loop=inf

[pixart]
glsl-shaders-clr
scale=oversample
dscale=mitchell
cscale=oversample
correct-downscaling=yes
linear-downscaling=yes
linear-upscaling=yes
sigmoid-upscaling=no

[MV]
profile-cond=p.path and (p.path:find("/Music/"))
profile-restore=copy
video-sync=audio #display-desync
sid=no
shuffle=yes
gapless-audio=yes
audio-pitch-correction=no
watch-later-options=volume,audio-delay,panscan,aid,sid,sub-delay,sub-ass-override,deband,video-crop
script-opts=subtitles-auto_download=no
script-opts=replaygain-auto_scan=true

[spatial-audio]
profile-cond=get("audio-params/channel-count", 0) > 2
profile-restore=copy
ao=avfoundation

[fallback-cover]
cover-art-files-append=~~/cover.png
[extension.flac]
profile=fallback-cover
[extension.mp3]
profile=fallback-cover
[extension.opus]
profile=fallback-cover
[extension.m4a]
profile=fallback-cover
[extension.ogg]
profile=fallback-cover
[extension.wav]
profile=fallback-cover
[extension.aac]
profile=fallback-cover

[battery]
profile-cond=p["user-data/battery"] == "yes"
profile-restore=copy
video-sync=audio
scale=spline36
scale-blur=1
sigmoid-upscaling=no
cscale=bicubic_fast
interpolation=no
#hr-seek=no
#deband=no
#blend-subtitles=no
glsl-shaders=""
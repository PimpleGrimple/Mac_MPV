# ======
# Video
# ======
vo=gpu-next
hwdec=videotoolbox
target-prim=display-p3
target-trc=srgb #this is a bitch you can boost it if you like
target-contrast=1336 #Contrast Ratio = peak brightness ÷ blackpoint
#this will control the brightness of stuff in sdr i think im sure mpv applies it for stuff other than bt1886 any way you can change this as you wish too but don't
target-colorspace-hint=no
treat-srgb-as-power22=no
video-sync=display-resample
scale=ewa_lanczos
#linear-upscaling=yes
sigmoid-upscaling=yes
#scale-antiring=0.5
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
#dscale-antiring=0.5
cscale=ewa_lanczos
dither-depth=no
#interpolation=yes
tscale=oversample
deband-iterations=3
deband-threshold=42
deband-range=12
deband-grain=24
hr-seek=yes
hr-seek-framedrop=yes
#cache-pause=no
demuxer-max-bytes=500MiB
demuxer-max-back-bytes=200MiB

# ======
# Audio
# ======
replaygain=track
replaygain-fallback=-5
audio-file-auto=fuzzy
alang=chi,ko,jpn,eng
ao=coreaudio          #avfoundation for spacial audio

# =========
# Subtitle
# =========
#sid=no
sub-auto=fuzzy
sub-file-paths-append=ass:srt:sub:subs:subtitles #"path"
slang=eng
subs-fallback=yes
sub-use-margins=no
sub-scale-by-window=yes
sub-scale-with-window=yes
blend-subtitles=yes

# =======
# Window
# =======
fs=yes
#native-fs=no
autofit=73%x73% #1920x1080
border=no
#idle=yes
#keep-open=yes

# =========
# Playlist
# =========
#shuffle=yes
#loop-playlist=yes
autocreate-playlist=same  #filter to include everthing in the filter below
directory-filter-types=video,audio,image
#directory-mode=lazy
image-display-duration=inf
screenshot-png-compression=9
#screenshot-tag-colorspace=no
save-watch-history=yes
save-position-on-quit=yes
watch-later-options=start,speed,volume,audio-delay,panscan,aid,vid,sid,sub-delay,inverse-tone-mapping

# =========
# Profiles
# =========
[protocol.https]
profile-restore=copy
cookies=yes
cookies-file=~/.config/mpv/cache/scripts/cookies.txt
force-seekable=yes
demuxer-max-bytes=60M
demuxer-max-back-bytes=50M

[jpg-fix] #this fixed a problem i had but it will ruin your images if you have jpegs that are full keep that in mind
profile-cond=filename:match("%.jpe?g$") ~= nil
profile-restore=copy
vf-add=format=colorlevels=limited

[Gif]
profile-cond=get("duration", math.huge) <= 10
profile-restore=copy
loop=inf

[MV]
profile-cond=p.path and (p.path:find("/Music/") or (p.duration and p.duration < 100))
profile-restore=copy
#video=no
video-sync=display-desync
script-opts-append=skip_intro-enabled=no
watch-later-options=volume,audio-delay,panscan,aid,sid,sub-delay,inverse-tone-mapping

[HDR]
profile-cond=p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg"
profile-restore=copy
icc-use-luma=yes
target-peak=500
# [DTM] # this is the dynamic tone mapping part it is absolutly preferential so you can change any of the values of it as you wish but make sure you know what your doing first
tone-mapping=bt.2446a #good consistent tonemapper
hdr-compute-peak=yes #tries to check for the brightness of the scenes and tonemape accordingly it is nice but it could also drive you crazy with it's default flickering
hdr-peak-percentile=99.995 #drops the top most part of the specular highlightes in attempt to stop the flickering
hdr-peak-decay-rate=100 #decides how fast the scene brightness can change the final solution to the compute peak flicker
hdr-scene-threshold-low=4 #tells mpv this is a differenct scene entirly so don't stick with the decay rate and change instantly
hdr-scene-threshold-high=16
tone-mapping-max-boost=1.2 #boosts the dark areas in hdr you can boost this if it is too dark to your liking
gamut-mapping-mode=perceptual #don't mess with this

[DolbyVision]
profile-cond=get("video-params/colormatrix") == "dolbyvision" or (filename ~= nil and (filename:lower():find("dovi") ~= nil or filename:lower():find("dolbyvision") ~= nil or filename:lower():find("dolby.vision") ~= nil or filename:lower():match("[%.%-_]dv[%.%-_]") ~= nil))
profile-restore=copy
tone-mapping=spline #best for dolbyvision
hdr-compute-peak=no

[HDR10+]
profile-cond=get("video-params/scene-max-r", 0) > 0
profile-restore=copy
tone-mapping=st2094-40 #best for hdr10+
hdr-compute-peak=no

[4k] #too much i think it but it's here if you want it
#profile-cond=width >= 3840 or height >= 2160
profile-restore=copy
glsl-shaders-append=~~/shaders/SSimDownscaler.glsl
linear-downscaling=no
dscale-antiring=0

[SD]
profile-cond=p.path and not p.path:find("%vsprocessed%.") and width and height and (width * height) < 1228800
profile-restore=copy
#glsl-shaders-append=~~/shaders/ArtCNN/ArtCNN_C4F16.glsl
deband=yes
sub-gauss=0.8

#i don't use these anymore you can use them if you like
#[SD-Telecine]
#profile-cond=string.find(string.match(path or "", "[^/\\]+$") or "", ".tel.", 1, true) ~= nil
#profile-restore=copy
#vf=lavfi=[fieldmatch=order=auto:combmatch=full,decimate]

#[SD-Interlace]
#profile-cond=string.find(string.match(path or "", "[^/\\]+$") or "", ".int.", 1, true) ~= nil
#profile-restore=copy
#vf=lavfi=[bwdif=mode=1:deint=interlaced]

#[SD-mix_N_mash]
#profile-cond=string.find(string.match(path or "", "[^/\\]+$") or "", ".mix.", 1, true) ~= nil
#profile-restore=copy
#vf=lavfi=[fieldmatch=order=auto:combmatch=full,bwdif=mode=0:deint=interlaced,decimate]

[Anime4K]
profile-restore=copy
glsl-shaders-append=~~/shaders/Anime4K/Anime4K_Clamp_Highlights.glsl
glsl-shaders-append=~~/shaders/Anime4K/Anime4K_Restore_CNN_M.glsl
glsl-shaders-append=~~/shaders/Anime4K/Anime4K_Upscale_CNN_x2_M.glsl
glsl-shaders-append=~~/shaders/Anime4K/Anime4K_AutoDownscalePre_x2.glsl
deband=yes

[FSRCNNX]
profile-restore=copy
glsl-shaders-append=~~/shaders/FSRCNNX/FSRCNNX_x2_16-0-4-1.glsl

[KrigBilateral]
profile-restore=copy
glsl-shaders-append=~~/shaders/KrigBilateral.glsl

[Inverse-TM]
profile-restore=copy
inverse-tone-mapping=yes
target-peak=500
hdr-compute-peak=no

[battery] #really important mpv can bring the mac to it's knees if you let it
profile-restore=copy
video-sync=audio
scale=spline36
sigmoid-upscaling=no
scale-antiring=0
dscale=spline36
correct-downscaling=no
linear-downscaling=no
dscale-antiring=0
cscale=spline36
interpolation=no
deband=no
hr-seek=no
blend-subtitles=no

# ======
# Paths
# ======
icc-cache-dir="~~/cache/icc"
gpu-shader-cache-dir="~~/cache/shaders"
watch-later-dir="~~/cache/watch_later"
watch-history-path="~~/cache/watch_history.jsonl"
use-filedir-conf=yes
input-conf="~~/mess.conf"
#input-builtin-bindings=no
#include="~~/styles.conf"
#include="~~/profiles.conf"
log-file="~~/cache/mpv.log"
msg-level=all=v
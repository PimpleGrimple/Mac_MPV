# =====
# Core
# =====
vo=gpu-next #libmpv
gpu-api=metal #vulkan
gpu-context=mac #macvk
hwdec=videotoolbox
hwdec-codecs=h264,hevc,vp9,prores
hidpi-window-scale=no
#swapchain-depth=1
#vulkan-device=Apple M2
#vulkan-queue-count=4
#vd-lavc-threads=4
#vd-lavc-fast=yes
#vd-lavc-dr=yes
#untimed
#framedrop=no
#demuxer-readahead-secs=10
demuxer-max-bytes=300MiB
demuxer-max-back-bytes=200MiB
#cache-secs=10
#cache-pause=no
#cache-pause-wait=5
#cache-pause-initial=yes
#vd-queue-enable=yes
#vd-queue-max-samples=300
#vd-queue-max-secs=30
#vd-queue-max-bytes=300MiB
#hr-seek=yes
#hr-seek-framedrop=no
disc-menu=yes
#use-filedir-conf=yes
macos-menu-shortcuts=yes
input-builtin-bindings=no
#input-default-bindings=no
#input-conf="~~/mess.conf"
#input-commands-append=load-input-conf ~~/scripts.conf
include="~~/styles.conf"
log-file="~~/cache/mpv.txt"
icc-cache-dir="~~/cache/icc"
gpu-shader-cache-dir="~~/cache/shaders"
watch-later-dir="~~/cache/watch_later"
watch-history-path="~~/cache/watch_history.jsonl"
#msg-level=all=v

# ======
# Video
# ======
target-colorspace-hint=yes
target-colorspace-hint-strict=no
target-prim=display-p3
target-gamut=display-p3
target-trc=srgb
treat-srgb-as-power22=no
target-contrast=1300
#gamma-factor=1.12
video-sync=display-resample
#interpolation=yes
tscale=oversample
scale=ewa_hanning
scale-blur=0.9753886283057314
sigmoid-upscaling=yes
#dscale=mitchell
linear-downscaling=yes
correct-downscaling=yes
cscale=ewa_hanning
cscale-blur=0.9753886283057314
dither=no

# ======
# Audio
# ======
audio-file-auto=fuzzy
alang=chi,ko,ja,en
ao=coreaudio
#audio-buffer=0.5
replaygain=track
replaygain-fallback=-4
replaygain-clip=no
#gapless-audio=yes
#initial-audio-sync=no

# =========
# Subtitle
# =========
sub-auto=fuzzy
sub-file-paths-append=ass:srt:sub:subs:subtitles #"path"
slang=en,eng
subs-fallback=yes
blend-subtitles=yes
sub-use-margins=no
sub-scale-by-window=yes
sub-scale-with-window=yes
sub-ass-scale-with-window=yes
secondary-sub-pos=0
sub-hinting=light
sub-fix-timing=yes
image-subs-hdr-peak=100
sub-hdr-peak=100
#demuxer-mkv-subtitle-preroll=yes
#demuxer-mkv-subtitle-preroll-secs=2

#sub-ass-use-video-data=all [none, aspect-ratio]
#sub-ass-style-overrides-append=PlayResY=600
#sub-ass-style-overrides-append=FontSize=70

# =========
# Playlist
# =========
#loop-playlist=yes
prefetch-playlist=yes
autocreate-playlist=filter #same
directory-filter-types=video,audio,image
directory-mode=ignore #lazy
autoload-files=yes
image-display-duration=inf
save-watch-history=yes
save-position-on-quit=yes
reset-on-next-file=panscan,deband,video-crop,glsl-shaders
write-filename-in-watch-later-config=yes
#ignore-path-in-watch-later-config=yes
watch-later-options=start,volume,audio-delay,panscan,aid,vid,sid,sub-delay,sub-ass-override,video-crop #,deband
#watch-later-options-clr

# ===========
# Screenshot
# ===========
screenshot-format=png
screenshot-png-compression=9
#screenshot-jpeg-quality=99
#screenshot-jpeg-source-chroma=no
#screenshot-tag-colorspace=no
screenshot-dir=~/Pictures/mpv/screenshots
screenshot-template='%tY-%tm-%td_%P' #%02n
#screenshot-sw=yes

# =======
# Window
# =======
fs=yes
#native-fs=no
macos-fs-animation-duration=0
macos-title-bar-appearance=vibrantDark
macos-title-bar-material=popover
force-window-position=yes
force-window=yes #immediate
window-dragging=no
#keep-open=yes
idle=once
autofit=70%x70% #1920x1080
border=no
osc=no
osd-bar=no
osd-duration=2000
cursor-autohide=2000
input-ar-delay=300 
input-ar-rate=9

# =========
# Profiles
# =========
[meme]
glsl-shaders-append="~~/shaders/RAISR/ravu/rgba16hf/zoom/ravu-zoom-ar-r3.hook"
glsl-shaders-append="~~/shaders/CfL/CfL_Prediction_RT.glsl"

[altscale]
glsl-shaders-append="~~/shaders/AltScale/Luma/altUpscaleLuma.glsl"
glsl-shaders-append="~~/shaders/AltScale/Chroma/altUpscaleChroma.glsl"

[battery]
profile-restore=copy
video-sync=audio
vf=""
scale=catmull_rom
scale-blur=1
sigmoid-upscaling=no
linear-upscaling=yes
dscale=hermite
cscale=catmull_rom
cscale-blur=1
interpolation=no
glsl-shaders-clr
script-opts-append=deint-auto_scan_sd=no

[widescreen]
profile-cond=width and height and width/height > 1.7 and p["native-fs"] ~= false
profile-restore=copy
video-pan-y=-0.013 #0.057

[Streams]
profile-cond=demuxer_via_network
profile-restore=copy
cookies-file=~~/cache/scripts/cookies.txt
user-agent="Mozilla/5.0"
force-seekable=yes
cache-secs=10

[Smooth-Motion]
profile-restore=copy
video-sync=display-resample
interpolation=yes
tscale=sphinx
tscale-blur=0.6991556596428412
tscale-radius=1.01

[4k]
profile-cond=width and height and (width >= 3840 or height >= 2160) and not get("user-data/battery", false)
profile-restore=copy
glsl-shaders-append=~~/shaders/SSim/SSimDownscaler_RT.glsl
dscale=mitchell
linear-downscaling=no

[HDR]
profile-cond=p["video-params/gamma"] == "pq" or p["video-params/gamma"] == "hlg"
profile-restore=copy
target-peak=500
# [DTM] #
#tone-mapping=bt.2446a
#tone-mapping-param=0.25
#hdr-compute-peak=no
#allow-delayed-peak-detect=yes
hdr-peak-percentile=99.995
hdr-peak-decay-rate=120
hdr-scene-threshold-low=6
hdr-scene-threshold-high=12
hdr-contrast-recovery=0.30
gamut-mapping-mode=perceptual
screenshot-format=avif
#screenshot-avif-encoder=libsvtav1
screenshot-avif-pixfmt=yuv420p10le
screenshot-avif-opts=crf=0

[DolbyVision]
profile-cond=get("video-params/colormatrix") == "dolbyvision" or (filename ~= nil and (filename:lower():find("dovi") ~= nil or filename:lower():find("dolbyvision") ~= nil or filename:lower():find("dolby.vision") ~= nil or filename:lower():match("[%.%-_]dv[%.%-_]") ~= nil))
profile-restore=copy
tone-mapping=spline
hdr-compute-peak=no

[HDR10+]
profile-cond=get("video-params/scene-max-r", 0) > 0
profile-restore=copy
tone-mapping=st2094-40
hdr-compute-peak=no

[Inverse-TM]
profile-cond=p["inverse-tone-mapping"] == true
profile-restore=copy
target-peak=300
tone-mapping=spline
hdr-compute-peak=no

[Sharpen]
profile-restore=copy
deband=yes
deband-iterations=3
glsl-shaders-append=~~/shaders/Adaptive-sharpen/Adaptive_sharpen_RT.glsl

[deband-8bit]
profile-cond=((({yuv420p=true, yuvj420p=true, yuv422p=true, yuv444p=true, nv12=true})[get("video-params/pixelformat", "")] or ({yuv420p=true, yuvj420p=true, yuv422p=true, yuv444p=true, nv12=true})[get("video-params/hw-pixelformat", "")]))  #and not get("deband", false) and not get("user-data/battery", false)
profile-restore=copy
deband=yes
deband-iterations=1
deband-threshold=48
deband-range=16
deband-grain=32
#glsl-shaders-append=~~/shaders/Deband/neo_f3kdb_luma_RT.glsl
#glsl-shaders-append=~~/shaders/Noise/noise_static_luma.hook

[SD-clean]
profile-cond=width and height and (width * height) >= 450000 and (width * height) <= 1228800 and not get("user-data/battery", false) and not (get("path", ""):sub(1, 6) == "dvd://") # and (not p["user-data/cadence"] or p["user-data/cadence"] == "progressive" or p["user-data/cadence"] == "soft_telecine")
profile-restore=copy
#glsl-shaders-append="~~/shaders/ArtCNN/C4F16/ArtCNN_C4F16.glsl"
glsl-shaders-append="~~/shaders/FSRCNNX/Standard/FSRCNNX_x2_16_0_4_1.glsl"

[SD-restore]
profile-cond=width and height and (width * height) < 450000 and not get("user-data/battery", false) and not (get("path", ""):sub(1, 6) == "dvd://") # and (not p["user-data/cadence"] or p["user-data/cadence"] == "progressive" or p["user-data/cadence"] == "soft_telecine")
profile-restore=copy
glsl-shaders-append=~~/shaders/ACNet/HDN/ARNet_F8B8_hdn.glsl
glsl-shaders-append=~~/shaders/Adaptive-sharpen/Adaptive_sharpen_RT.glsl
#glsl-shaders-append=~~/shaders/Anime4K/Experimental-Effects/Anime4K_Thin_HQ.glsl
glsl-shader-opts=STR=0.5
deband=yes
deband-iterations=3
deband-threshold=48
deband-range=16
deband-grain=32

[SD-DVD]
profile-cond=((p["user-data/cadence"] == "telecine" or p["user-data/cadence"] == "interlaced" or p["user-data/cadence"] == "mix") or get("path", ""):sub(1, 6) == "dvd://") and not get("user-data/battery", false)
profile-restore=copy
glsl-shaders-clr
#glsl-shaders-append=~~/shaders/Anime4K/Denoise/Anime4K_Denoise_Bilateral_Median.glsl
#glsl-shaders-append=~~/shaders/ETC/FineDehalo_lite_RT.glsl
#glsl-shaders-append=~~/shaders/plane/plane_shift_yuv_RT.glsl
glsl-shaders-append=~~/shaders/ArtCNN/C4F16/ArtCNN_C4F16.glsl
#glsl-shaders-append=~~/shaders/AMD/CAS/AMD_CAS_luma_RT.glsl
#glsl-shaders-append=~~/shaders/SSim/SSimSuperRes_RT.glsl
sub-gauss=0.8

[image]
profile-cond=p['current-tracks/video/image'] == true
profile-restore=copy

[Gif]
profile-cond=get("duration", 0) > 0 and get("duration") <= 10
profile-restore=copy
loop=inf

[pixart]
profile-restore=copy
glsl-shaders-clr
scale=oversample
dscale=mitchell
cscale=oversample
correct-downscaling=yes
linear-downscaling=yes
linear-upscaling=yes
sigmoid-upscaling=no

[MV]
profile-cond=p.path and (p.path:find("/Music/"))
profile-restore=copy
video-sync=audio #display-desync
sid=no
speed=1
shuffle=yes
loop-playlist=yes
ao=avfoundation
audio-pitch-correction=no
watch-later-options=volume,audio-delay,panscan,aid,sid,sub-delay,sub-ass-override,video-crop #,deband
script-opts-append=subtitles-auto_download=no
script-opts-append=replaygain-auto_scan=true
script-opts-append=replaygain-auto_bake=true

[spatial-audio]
profile-cond=get("audio-params/channel-count", 0) > 2
profile-restore=copy
ao=avfoundation

[fallback-cover]
cover-art-files-append=~~/cover.webp
[extension.flac]
profile=fallback-cover
[extension.mp3]
profile=fallback-cover
[extension.wav]
profile=fallback-cover
